<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#fafbfc"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">机会-方案树（OST）—— 全书唯一的贯穿骨架</text>

  <!-- 成果（根） -->
  <rect x="330" y="52" width="340" height="46" rx="10" fill="#1f6feb" opacity="0.92"/>
  <text x="500" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">期望成果（根）</text>
  <text x="500" y="90" text-anchor="middle" font-size="11" fill="#dbeafe">业务需要什么 · 例：增加每周观看时长</text>

  <line x1="500" y1="98" x2="500" y2="122" stroke="#5b6470" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 机会空间 -->
  <rect x="240" y="126" width="520" height="30" rx="15" fill="#eef2f7"/>
  <text x="500" y="146" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">机会空间：客户的需求 · 痛点 · 渴望（满足它们才能推动成果）</text>

  <!-- 侧注：自顶向下 / 自底向上 -->
  <rect x="30" y="126" width="160" height="56" rx="8" fill="#f0f7ff" stroke="#a8c6e8"/>
  <text x="110" y="147" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e4e79">自顶向下</text>
  <text x="110" y="165" text-anchor="middle" font-size="10.5" fill="#33587a">拆解大而棘手的机会</text>
  <path d="M 190 150 L 236 140" fill="none" stroke="#a8c6e8" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <rect x="810" y="126" width="160" height="56" rx="8" fill="#fdf3ec" stroke="#e0b090"/>
  <text x="890" y="147" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8a4a1d">自底向上</text>
  <text x="890" y="165" text-anchor="middle" font-size="10.5" fill="#8a5a35">测试结果反修上层</text>
  <path d="M 810 150 L 764 141" fill="none" stroke="#e0b090" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arr)"/>

  <!-- 分支线 -->
  <line x1="500" y1="156" x2="500" y2="172" stroke="#5b6470" stroke-width="1.2"/>
  <line x1="330" y1="172" x2="670" y2="172" stroke="#5b6470" stroke-width="1.2"/>
  <line x1="330" y1="172" x2="330" y2="186" stroke="#5b6470" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="670" y1="172" x2="670" y2="186" stroke="#5b6470" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 顶层机会（父） -->
  <rect x="230" y="190" width="200" height="38" rx="8" fill="#cfe1f5" stroke="#7aa2d0"/>
  <text x="330" y="214" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a5f">我找不到东西看</text>
  <rect x="570" y="190" width="200" height="38" rx="8" fill="#cfe1f5" stroke="#7aa2d0"/>
  <text x="670" y="214" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a5f">我想在路上看剧</text>

  <!-- 兄弟机会（子）：三框不重叠 -->
  <line x1="330" y1="228" x2="330" y2="244" stroke="#8a93a0" stroke-width="1"/>
  <line x1="135" y1="244" x2="490" y2="244" stroke="#8a93a0" stroke-width="1"/>
  <line x1="135" y1="244" x2="135" y2="258" stroke="#8a93a0" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="315" y1="244" x2="315" y2="258" stroke="#8a93a0" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="490" y1="244" x2="490" y2="258" stroke="#8a93a0" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="60" y="262" width="150" height="52" rx="8" fill="#fff" stroke="#b6c2cf"/>
  <text x="135" y="284" text-anchor="middle" font-size="12" fill="#374151">我喜欢的剧集</text>
  <text x="135" y="301" text-anchor="middle" font-size="12" fill="#374151">都看完了</text>
  <rect x="225" y="262" width="180" height="52" rx="8" fill="#fef3c7" stroke="#d9a406" stroke-width="2"/>
  <text x="315" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#7c5800">我不知道怎么搜剧</text>
  <text x="315" y="301" text-anchor="middle" font-size="11" fill="#92700c">★ 目标机会（叶节点）</text>
  <rect x="420" y="262" width="140" height="52" rx="8" fill="#fff" stroke="#b6c2cf"/>
  <text x="490" y="284" text-anchor="middle" font-size="12" fill="#374151">正在看的剧</text>
  <text x="490" y="301" text-anchor="middle" font-size="12" fill="#374151">下架了</text>

  <line x1="670" y1="228" x2="670" y2="244" stroke="#8a93a0" stroke-width="1"/>
  <line x1="655" y1="244" x2="810" y2="244" stroke="#8a93a0" stroke-width="1"/>
  <line x1="655" y1="244" x2="655" y2="260" stroke="#8a93a0" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="810" y1="244" x2="810" y2="260" stroke="#8a93a0" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="590" y="264" width="130" height="34" rx="8" fill="#fff" stroke="#b6c2cf"/>
  <text x="655" y="286" text-anchor="middle" font-size="12" fill="#374151">在飞机上看</text>
  <rect x="745" y="264" width="130" height="34" rx="8" fill="#fff" stroke="#b6c2cf"/>
  <text x="810" y="286" text-anchor="middle" font-size="12" fill="#374151">在火车上看</text>

  <line x1="315" y1="314" x2="315" y2="346" stroke="#5b6470" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 方案空间 -->
  <rect x="120" y="352" width="760" height="30" rx="15" fill="#eef2f7"/>
  <text x="500" y="372" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">方案空间：围绕目标机会构思 15–20 个想法，贴点投票选出 3 个候选</text>

  <line x1="315" y1="382" x2="315" y2="398" stroke="#5b6470" stroke-width="1.2"/>
  <line x1="245" y1="398" x2="725" y2="398" stroke="#5b6470" stroke-width="1.2"/>
  <line x1="245" y1="398" x2="245" y2="410" stroke="#5b6470" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="500" y1="398" x2="500" y2="410" stroke="#5b6470" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="725" y1="398" x2="725" y2="410" stroke="#5b6470" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="160" y="414" width="170" height="40" rx="8" fill="#dcf5e6" stroke="#5ba97c"/>
  <text x="245" y="439" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d5c3a">方案 A</text>
  <rect x="415" y="414" width="170" height="40" rx="8" fill="#dcf5e6" stroke="#5ba97c"/>
  <text x="500" y="439" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d5c3a">方案 B</text>
  <rect x="640" y="414" width="170" height="40" rx="8" fill="#dcf5e6" stroke="#5ba97c"/>
  <text x="725" y="439" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d5c3a">方案 C</text>

  <line x1="500" y1="454" x2="500" y2="482" stroke="#5b6470" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 假设测试 -->
  <rect x="150" y="486" width="700" height="30" rx="15" fill="#eef2f7"/>
  <text x="500" y="506" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">假设测试：测「信仰之跃」假设，而不是测整个想法</text>

  <rect x="120" y="526" width="240" height="42" rx="8" fill="#fce8e6" stroke="#d97066"/>
  <text x="240" y="543" text-anchor="middle" font-size="11.5" fill="#8a352d">共享假设（整组想法都依赖）</text>
  <text x="240" y="560" text-anchor="middle" font-size="11.5" fill="#8a352d">例：订阅用户想看体育赛事</text>
  <rect x="380" y="526" width="240" height="42" rx="8" fill="#fff" stroke="#b6c2cf"/>
  <text x="500" y="553" text-anchor="middle" font-size="11.5" fill="#374151">假设测试 A</text>
  <text x="500" y="569" text-anchor="middle" font-size="11.5" fill="#374151">「10 人里至少 3 人…」</text>
  <rect x="640" y="526" width="240" height="42" rx="8" fill="#fff" stroke="#b6c2cf"/>
  <text x="760" y="553" text-anchor="middle" font-size="11.5" fill="#374151">假设测试 B / C</text>
  <text x="760" y="569" text-anchor="middle" font-size="11.5" fill="#374151">小步快跑，先小后大</text>

  <text x="500" y="606" text-anchor="middle" font-size="11" fill="#8a93a0">「达成期望成果」是结构不良问题 —— 树就是给它的框定 · 整棵树每周都在演化（第 2、6 章）</text>
</svg>
