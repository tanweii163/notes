<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="900" height="540" fill="#fafbfc"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">假设映射 —— 找出「信仰之跃」假设（David J. Bland）</text>

  <!-- 坐标轴 -->
  <line x1="130" y1="450" x2="130" y2="90" stroke="#5b6470" stroke-width="1.6" marker-end="url(#ax)"/>
  <line x1="130" y1="450" x2="830" y2="450" stroke="#5b6470" stroke-width="1.6"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
  </defs>

  <text x="90" y="270" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569" transform="rotate(-90 90 270)">对想法成功的重要性（高 → 低）</text>
  <text x="480" y="486" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">已有证据：强（左）→ 弱（右）</text>

  <!-- 四象限网格 -->
  <line x1="130" y1="270" x2="830" y2="270" stroke="#c3cbd4" stroke-width="1"/>
  <line x1="480" y1="450" x2="480" y2="90" stroke="#c3cbd4" stroke-width="1"/>

  <!-- 右上高亮 -->
  <rect x="480" y="90" width="350" height="180" fill="#fdeaa8" opacity="0.55"/>
  <rect x="500" y="104" width="310" height="58" rx="10" fill="#d9a406" opacity="0.92"/>
  <text x="655" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">信仰之跃假设</text>
  <text x="655" y="147" text-anchor="middle" font-size="11" fill="#fdf3d0">重要 × 证据少 —— 最该先测的 2–3 条</text>

  <!-- 象限注释 -->
  <text x="305" y="130" text-anchor="middle" font-size="11.5" fill="#5b6470">已证实的重要假设</text>
  <text x="305" y="150" text-anchor="middle" font-size="11" fill="#8a93a0">不用测，安心依赖</text>
  <text x="305" y="410" text-anchor="middle" font-size="11.5" fill="#5b6470">已证实的次要假设</text>
  <text x="655" y="410" text-anchor="middle" font-size="11.5" fill="#5b6470">不重要的未知项</text>
  <text x="655" y="430" text-anchor="middle" font-size="11" fill="#8a93a0">别浪费时间去测</text>

  <!-- 示例点 -->
  <g>
    <circle cx="300" cy="170" r="9" fill="#5ba97c"/>
    <text x="300" y="198" text-anchor="middle" font-size="11.5" fill="#1d5c3a">可用性（往往已了解）</text>
    <circle cx="690" cy="185" r="9" fill="#d97066"/>
    <text x="676" y="190" text-anchor="end" font-size="11.5" fill="#8a352d">核心合意性</text>
    <circle cx="640" cy="232" r="9" fill="#d97066"/>
    <text x="654" y="237" text-anchor="start" font-size="11.5" fill="#8a352d">商业可行性</text>
    <circle cx="560" cy="258" r="9" fill="#d97066"/>
    <text x="560" y="280" text-anchor="middle" font-size="11.5" fill="#8a352d">伦理（几乎人人盲区）</text>
  </g>

  <!-- 操作提示 -->
  <rect x="40" y="502" width="820" height="26" rx="13" fill="#eef2f7"/>
  <text x="450" y="520" text-anchor="middle" font-size="11.5" fill="#475569">做法：相对摆放（每条 ≤10 分钟）→ 从右上角测起 → 目标是把假设从右侧「移到左侧」（第 9 章）</text>
</svg>
