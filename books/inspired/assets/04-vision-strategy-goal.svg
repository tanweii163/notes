<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">找对产品：愿景 → 战略 → 目标 → 团队</text>

  <!-- 愿景 -->
  <rect x="40" y="110" width="200" height="150" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="140" y="152" text-anchor="middle" font-size="18" font-weight="bold" fill="#3730a3">产品愿景</text>
  <text x="140" y="180" text-anchor="middle" font-size="13" fill="#4338ca">想创造的未来</text>
  <text x="140" y="202" text-anchor="middle" font-size="13" fill="#4338ca">2–5 年（硬件 5–10）</text>
  <text x="140" y="232" text-anchor="middle" font-size="12.5" fill="#6d28d9">激励工具，不是规格</text>

  <!-- 战略 -->
  <rect x="290" y="110" width="200" height="150" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="390" y="152" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d4ed8">产品战略</text>
  <text x="390" y="180" text-anchor="middle" font-size="13" fill="#1e40af">抵达愿景的路径</text>
  <text x="390" y="202" text-anchor="middle" font-size="13" fill="#1e40af">一系列产品/市场契合</text>
  <text x="390" y="232" text-anchor="middle" font-size="12.5" fill="#1e40af">一次只聚焦一个市场</text>

  <!-- 目标 -->
  <rect x="540" y="110" width="200" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <text x="640" y="152" text-anchor="middle" font-size="18" font-weight="bold" fill="#047857">业务目标 / OKR</text>
  <text x="640" y="180" text-anchor="middle" font-size="13" fill="#065f46">完成什么、如何衡量</text>
  <text x="640" y="202" text-anchor="middle" font-size="13" fill="#065f46">聚焦产品团队层面</text>
  <text x="640" y="232" text-anchor="middle" font-size="12.5" fill="#065f46">衡量业务成果，不是产出</text>

  <!-- 团队 -->
  <rect x="790" y="110" width="130" height="150" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="855" y="160" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">产品团队</text>
  <text x="855" y="192" text-anchor="middle" font-size="13" fill="#b45309">自主找最佳方案</text>
  <text x="855" y="214" text-anchor="middle" font-size="13" fill="#b45309">对结果负责</text>

  <!-- 箭头 -->
  <g stroke="#94a3b8" stroke-width="3">
    <line x1="240" y1="185" x2="286" y2="185"/>
    <line x1="490" y1="185" x2="536" y2="185"/>
    <line x1="740" y1="185" x2="786" y2="185"/>
  </g>
  <polygon points="290,185 278,179 278,191" fill="#94a3b8"/>
  <polygon points="540,185 528,179 528,191" fill="#94a3b8"/>
  <polygon points="790,185 778,179 778,191" fill="#94a3b8"/>

  <!-- 替代路线图 -->
  <rect x="40" y="330" width="880" height="90" rx="12" fill="#fdf2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="480" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">典型路线图（✗）：一份按优先级排列的功能/项目清单</text>
  <text x="480" y="388" text-anchor="middle" font-size="14" fill="#7f1d1d">把“想法”变成了“承诺” → 公司把它理解为必须交付的承诺，哪怕它解决不了底层问题</text>
  <text x="480" y="408" text-anchor="middle" font-size="13" fill="#991b1b">替代：对业务成果排序，而不是对产品想法排序</text>

  <!-- 高诚信承诺 -->
  <rect x="40" y="460" width="880" height="120" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="480" y="492" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">高诚信承诺（✓）：如何回应“要日期 / 要交付”</text>
  <text x="480" y="520" text-anchor="middle" font-size="14" fill="#1e40af">先给一点时间做产品发现，验证价值 / 可用性 / 可行性 / 商业可行性</text>
  <text x="480" y="548" text-anchor="middle" font-size="14" fill="#1e40af">然后才做出知情的、公司可以信赖的日期与交付承诺 —— 尽量减到最少</text>
</svg>
