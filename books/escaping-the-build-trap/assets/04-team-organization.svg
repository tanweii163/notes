<svg style="max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="三种团队组织方式对比：围绕技术组件、围绕功能、围绕价值流">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="40" y="42" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#111827">团队怎么组织，决定团队在想什么</text>
  <text x="40" y="66" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#6b7280">三种方式都能画出漂亮的架构图，但它们把团队的注意力引向完全不同的地方</text>

  <!-- 卡片 1 -->
  <rect x="40" y="96" width="256" height="290" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="168" y="128" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#991b1b">围绕技术组件</text>
  <text x="60" y="162" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#7f1d1d">典型分工</text>
  <text x="60" y="184" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#450a0a">登录 API 团队、支付团队、</text>
  <text x="60" y="204" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#450a0a">消息队列团队……</text>
  <text x="60" y="238" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#7f1d1d">会发生什么</text>
  <text x="60" y="260" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#450a0a">组件早已稳定、无需再动，</text>
  <text x="60" y="280" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#450a0a">团队却要不停找活干：</text>
  <text x="60" y="300" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#450a0a">「这是我拥有的东西，</text>
  <text x="60" y="320" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#450a0a">我们得永远守着它。」</text>
  <text x="60" y="356" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#b91c1c">目标：让组件的待办列表别空着</text>

  <!-- 卡片 2 -->
  <rect x="322" y="96" width="256" height="290" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="450" y="128" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#92400e">围绕功能</text>
  <text x="342" y="162" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#78350f">典型分工</text>
  <text x="342" y="184" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#451a03">课程创建团队、课堂体验团队、</text>
  <text x="342" y="204" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#451a03">成绩报告团队……</text>
  <text x="342" y="238" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#78350f">会发生什么</text>
  <text x="342" y="260" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#451a03">覆盖了每一块，但没人对整体</text>
  <text x="342" y="280" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#451a03">负责；每个团队都想在</text>
  <text x="342" y="300" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#451a03">自己那一亩三分地再堆点东西，</text>
  <text x="342" y="320" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#451a03">许多工作其实不该排优先级。</text>
  <text x="342" y="356" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#b45309">目标：拿到「覆盖」</text>

  <!-- 卡片 3 -->
  <rect x="604" y="96" width="256" height="290" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="732" y="128" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#065f46">围绕价值流 / 目标</text>
  <text x="624" y="162" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#064e3b">典型分工</text>
  <text x="624" y="184" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#022c22">留存团队、接入新币种团队、</text>
  <text x="624" y="204" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#022c22">新用户获取团队……</text>
  <text x="624" y="238" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#064e3b">会发生什么</text>
  <text x="624" y="260" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#022c22">团队拥有目标、按成果评判，</text>
  <text x="624" y="280" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#022c22">被允许跨产品行动；信息不再</text>
  <text x="624" y="300" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#022c22">只装在一个人脑子里；</text>
  <text x="624" y="320" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#022c22">代价是需要大量的横向协同。</text>
  <text x="624" y="356" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#047857">目标：达成果，且只做该做的</text>

  <rect x="40" y="406" width="820" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="433" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#334155">分水岭只有一个：这个团队的目标，是「拥有什么」，还是「达成什么」？——按组件和按功能组织，答的都是前者。</text>
</svg>
