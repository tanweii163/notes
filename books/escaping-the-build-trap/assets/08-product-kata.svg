<svg style="max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="产品卡塔：理解方向、分析当前状态、设定下一目标、选择步骤四步循环">
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="40" y="42" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#111827">产品卡塔：找出「该建什么」的四步循环</text>
  <text x="40" y="66" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#6b7280">前三步属于战略制定与部署，第四步才是执行——练到不用看板子，它就成了思维方式</text>

  <!-- 中心 -->
  <circle cx="450" cy="272" r="70" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="266" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">产品卡塔</text>
  <text x="450" y="288" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#1d4ed8">我下一步要学什么？</text>

  <!-- 四节点 -->
  <rect x="330" y="112" width="240" height="66" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="450" y="137" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#0c4a6e">❶ 理解方向</text>
  <text x="450" y="159" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0369a1">看愿景 / 战略意图 / 产品举措</text>

  <rect x="620" y="240" width="240" height="66" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="740" y="265" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#0c4a6e">❷ 分析当前状态</text>
  <text x="740" y="287" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0369a1">离目标还有多远 + 指标测量值</text>

  <rect x="330" y="368" width="240" height="66" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="450" y="393" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#0c4a6e">❸ 设定下一目标</text>
  <text x="450" y="415" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0369a1">团队目标 / 选项目标（可每次度量）</text>

  <rect x="40" y="240" width="240" height="66" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="160" y="265" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#0c4a6e">❹ 选择步骤</text>
  <text x="160" y="287" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0369a1">问题探索 / 方案探索 / 方案优化</text>

  <!-- 箭头（顺时针） -->
  <path d="M576,160 C640,180 670,205 700,232" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#k)"/>
  <path d="M735,312 C722,350 700,368 660,382" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#k)"/>
  <path d="M324,404 C285,390 262,362 250,330" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#k)"/>
  <path d="M282,240 C310,196 330,175 350,158" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#k)"/>

  <!-- 六问 -->
  <rect x="40" y="470" width="392" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="494" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#111827">规划（问 1～4）</text>
  <text x="58" y="516" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#475569">目标是什么 · 现在在哪 · 最大障碍是什么</text>
  <text x="58" y="534" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#475569">· 我打算怎么试</text>

  <rect x="468" y="470" width="392" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="486" y="494" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#111827">复盘（问 5～6，决定要不要重来）</text>
  <text x="486" y="516" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#475569">我预期会发生什么（假设）</text>
  <text x="486" y="534" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#475569">· 实际发生了什么、我们学到了什么</text>
</svg>
