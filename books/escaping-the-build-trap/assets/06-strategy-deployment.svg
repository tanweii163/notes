<svg style="max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="战略部署的四个层级：愿景、战略意图、产品举措、选项">
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M5,0 L10,10 L0,10 z" fill="#0891b2"/>
    </marker>
    <marker id="dn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M5,10 L0,0 L10,0 z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="#ffffff"/>
  <text x="40" y="42" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#111827">战略部署的四个层级</text>
  <text x="40" y="66" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#6b7280">每一层只回答一个问题，时间尺度逐级缩短——目标是让人能行动，不是让人知道更多</text>

  <!-- 层级条 -->
  <rect x="40" y="92" width="700" height="72" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="62" y="120" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#312e81">愿景</text>
  <text x="62" y="146" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#3730a3">我们相信谁需要什么价值，我们要成为什么——为什么存在、要去哪</text>
  <text x="718" y="134" text-anchor="end" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#4338ca">数年～数十年</text>

  <rect x="90" y="180" width="600" height="72" rx="10" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="112" y="208" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#155e75">战略意图</text>
  <text x="112" y="234" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0e7490">基于现状通往愿景的一跃：小公司 1 个，大组织最多 3 个</text>
  <text x="668" y="222" text-anchor="end" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#0e7490">1～3 年</text>

  <rect x="140" y="268" width="500" height="72" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="162" y="296" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#115e59">产品举措</text>
  <text x="162" y="322" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0f766e">把业务目标翻译成：用哪个产品，解决哪个用户问题</text>
  <text x="618" y="310" text-anchor="end" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#0f766e">季度～一年</text>

  <rect x="190" y="356" width="400" height="72" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="212" y="384" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#92400e">选项（赌注）</text>
  <text x="212" y="410" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#a16207">团队自主探索的具体解法，靠实验验证真伪</text>
  <text x="568" y="398" text-anchor="end" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#a16207">2～4 周</text>

  <!-- 右侧收窄提示 -->
  <path d="M760,110 C790,180 800,300 800,380" fill="none" stroke="#0d9488" stroke-width="2"/>
  <text x="812" y="250" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0f766e">越往下</text>
  <text x="812" y="270" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0f766e">行动场子</text>
  <text x="812" y="290" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0f766e">越小</text>

  <!-- 双向箭头 -->
  <path d="M70,470 L70,392" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#up)"/>
  <text x="82" y="420" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0f766e">部署：把方向传下去</text>

  <path d="M340,468 L340,440" fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#dn)"/>
  <text x="352" y="462" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0e7490">回流：团队学到的东西喂回战略（信息物理学）</text>

  <rect x="40" y="492" width="820" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="518" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#334155">「毫无约束的团队，是组织里最害怕、最不敢行动的团队」——约束太松和太紧，同样让人动不了。</text>
</svg>
