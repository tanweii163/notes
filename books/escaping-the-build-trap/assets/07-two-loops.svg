<svg style="max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-label="战斗环与资产环：战略执行与产品资产的相互关系">
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="900" height="580" fill="#ffffff"/>
  <text x="40" y="42" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#111827">两个环：一个在打仗，一个在攒家当</text>
  <text x="40" y="66" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#6b7280">战略主线管「时间上的分解」，产品愿景与组合管「空间上的归属」——两者在产品举措处咬合</text>

  <!-- 北极星 -->
  <rect x="330" y="92" width="240" height="56" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450" y="117" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#4c1d95">公司愿景（北极星）</text>
  <text x="450" y="137" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5b21b6">两个环共用同一个方向</text>

  <!-- 左环 -->
  <circle cx="240" cy="360" r="128" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="240" y="252" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#155e75">战斗环</text>
  <text x="240" y="272" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0e7490">1～3 年转一圈</text>
  <text x="240" y="322" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#155e75">战略意图</text>
  <text x="240" y="342" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0e7490">↓</text>
  <text x="240" y="364" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#155e75">产品举措</text>
  <text x="240" y="384" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0e7490">↓</text>
  <text x="240" y="406" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#155e75">选项与实验</text>
  <text x="240" y="446" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0e7490">花钱买信息</text>

  <!-- 右环 -->
  <circle cx="664" cy="360" r="128" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text x="664" y="252" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#115e59">资产环</text>
  <text x="664" y="272" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0f766e">数年转一圈</text>
  <text x="664" y="322" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#115e59">产品组合（CPO 的投资盘）</text>
  <text x="664" y="350" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0f766e">产品愿景 A · 产品愿景 B</text>
  <text x="664" y="372" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0f766e">创新位（养下一个 Echo）</text>
  <text x="664" y="406" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#115e59">沉淀 · 长大 · 退役</text>
  <text x="664" y="446" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0f766e">存钱攒家当</text>

  <!-- 咬合箭头 -->
  <path d="M368,392 L534,392" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#b1)"/>
  <text x="451" y="382" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#6d28d9">① 沉淀</text>

  <path d="M534,320 L368,320" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#b2)"/>
  <text x="451" y="310" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#0f766e">② 约束</text>

  <path d="M240,228 L240,150" fill="none" stroke="#0891b2" stroke-width="2.5" marker-end="url(#b2)" stroke-dasharray="6 4"/>
  <text x="252" y="196" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#0e7490">③ 数据回流 · 换下一期意图</text>

  <!-- 图例 -->
  <rect x="40" y="502" width="820" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="524" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#334155">① 快 → 慢：验证赢了的选项长成正式产品，总结出产品愿景，进组合占一个仓位（Amazon Echo 走了五年）。</text>
  <text x="58" y="544" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#334155">② 慢 → 快：新的战略意图要落地时，产品愿景筛「挂在哪个产品上」，组合决定给多少容量。　③ 快 → 快：实验数据回流，修正战略意图本身。</text>
</svg>
