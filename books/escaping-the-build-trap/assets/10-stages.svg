<svg style="max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="开发四阶段：实验、Alpha、Beta、全面可用">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="40" y="42" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#111827">四个阶段：一套术语，让全公司知道现在在做什么</text>
  <text x="40" y="66" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#6b7280">构造糟糕的路线图，是产品与销售之间大量紧张关系的源头；统一阶段定义是最便宜的解法</text>

  <!-- 阶段条 -->
  <rect x="40" y="100" width="196" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="138" y="130" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#334155">实验</text>
  <text x="60" y="158" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#475569">理解问题、判断它</text>
  <text x="60" y="176" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#475569">值不值得解决</text>
  <text x="60" y="204" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#b91c1c">不写生产代码</text>
  <text x="60" y="228" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#475569">团队：问题 + 方案探索</text>

  <rect x="252" y="100" width="196" height="150" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="350" y="130" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#1e40af">Alpha</text>
  <text x="272" y="158" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#1e3a8a">判断方案对客户</text>
  <text x="272" y="176" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#1e3a8a">是否有吸引力</text>
  <text x="272" y="204" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">生产代码，小范围开放</text>
  <text x="272" y="228" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#1e3a8a">用户知道：可能变，也可能被砍</text>

  <rect x="464" y="100" width="196" height="150" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="562" y="130" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#075985">Beta</text>
  <text x="484" y="158" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0c4a6e">从技术角度判断</text>
  <text x="484" y="176" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0c4a6e">方案能否规模化</text>
  <text x="484" y="204" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#0369a1">客户更多，仍是一小部分</text>
  <text x="484" y="228" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#0c4a6e">已证明吸引力，除非技术不稳</text>

  <rect x="676" y="100" width="184" height="150" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="768" y="130" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#065f46">全面可用 GA</text>
  <text x="696" y="158" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#064e3b">方案向所有客户</text>
  <text x="696" y="176" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#064e3b">全面开放</text>
  <text x="696" y="204" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#047857">✓ 销售可以公开卖</text>
  <text x="696" y="228" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#064e3b">尽可能多地卖给目标市场</text>

  <!-- 分界说明 -->
  <path d="M664,272 L664,300" stroke="#047857" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="664" y="320" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#047857">销售边界</text>
  <text x="664" y="340" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#065f46">只卖 GA（或接近 GA 的 Beta）</text>

  <rect x="40" y="366" width="820" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="394" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#334155">这套术语的价值不在流程，而在预期：Alpha 阶段的功能允许被砍掉——这正是「完成」的定义能立住的前提。</text>
</svg>
