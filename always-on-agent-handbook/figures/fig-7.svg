<text x="395.0" y="77.5" text-anchor="middle" font-size="16" font-weight="600" fill="#173650">无重要变化</text>
<text x="395.0" y="97.5" text-anchor="middle" font-size="13" font-weight="400" fill="#173650">不发送</text>
<rect x="300" y="135" width="190" height="55" rx="8" fill="#dbeafe" stroke="#2563a6" stroke-width="1.5"/>
