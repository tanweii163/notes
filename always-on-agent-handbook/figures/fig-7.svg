<path d="M205 165 H250 V242 H300" fill="none" stroke="#376c9c" stroke-width="2" marker-end="url(#arr7)"/>
<path d="M490 162 H565" fill="none" stroke="#376c9c" stroke-width="2" marker-end="url(#arr7)"/>
<path d="M490 242 H530 V195 H565" fill="none" stroke="#376c9c" stroke-width="2" marker-end="url(#arr7)"/>
<path d="M715 175 H765" fill="none" stroke="#376c9c" stroke-width="2" marker-end="url(#arr7)"/>
<rect x="25" y="108" width="180" height="80" rx="8" fill="#dbeafe" stroke="#2563a6" stroke-width="1.5"/>
<text x="115.0" y="143.0" text-anchor="middle" font-size="16" font-weight="600" fill="#173650">Run 结束</text>
<text x="115.0" y="163.0" text-anchor="middle" font-size="13" font-weight="400" fill="#173650">选择是否通知</text>
