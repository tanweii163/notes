<rect x="565" y="135" width="150" height="80" rx="8" fill="#e0f2ed" stroke="#38836b" stroke-width="1.5"/>
<text x="640.0" y="170.0" text-anchor="middle" font-size="16" font-weight="600" fill="#173650">Outbox</text>
<text x="640.0" y="190.0" text-anchor="middle" font-size="13" font-weight="400" fill="#173650">待发消息</text>
<rect x="765" y="135" width="165" height="80" rx="8" fill="#dbeafe" stroke="#2563a6" stroke-width="1.5"/>
<text x="847.5" y="170.0" text-anchor="middle" font-size="16" font-weight="600" fill="#173650">Dispatcher</text>
<text x="847.5" y="190.0" text-anchor="middle" font-size="13" font-weight="400" fill="#173650">投递 / 重试</text>
