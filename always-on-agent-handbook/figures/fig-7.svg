<text x="395.0" y="177.5" text-anchor="middle" font-size="13" font-weight="400" fill="#173650">生成消息</text>
<rect x="300" y="215" width="190" height="55" rx="8" fill="#fff0db" stroke="#c17a28" stroke-width="1.5"/>
