ns-serif" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700">初始事件</text><text x="118.0" y="155" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">Thread T1</text><rect x="325" y="104" width="210" height="82" rx="12" fill="#e9f2ff" stroke="#2563eb" stroke-width="1.5"/><text x="430.0" y="130" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700">Router</text><text x="430.0" y="155" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">判断、创建 Worker</text><rect x="870" y="104" width="220" height="82" rx="12" fill="#f2eafe" stroke="#8051c7" stroke-width="1.5"/><text x="980.0" y="130" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#8051c7" text-anchor="middle" font-weight="700">Worker W1</text><text x="980.0" y="155" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">执行任务</text><path d="M208 145 L325 145" fill="none" stroke="#2563eb" stroke-width="2.2"  marker-end="url(#a7blue)"/><path d="M535 145 L870 145" fill="none" stroke="#2563eb" stroke-width="2.2"  marker-end="url(#a7blue)"/><text x="702.5" y="136.0" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">建立订阅 T1 → W1</text><rect x="28" y="239" width="180" height="82" rx="12" fill="#e5f8ef" stroke="#087f65" stroke-width="1.5"/><text x="118.0" y="265" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#087f65" text-anchor="middle" font-weight="700">后续事件</text><text x="118.0" y="290" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">同 Thread T1</text><rect x="325" y="239" width="210" height="82" rx="12" fill="#e5f8ef" stroke="#087f65" stroke-width="1.5"/><text x="430.0" y="265" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#087f65" text-anchor="middle" font-weight="700">订阅索引</text><text x="430.0" y="290" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">T1 → W1 / W2</text><path d="M208 280 L325 280" fill="none" stroke="#087f65" stroke-width="2.2"  marker-end="url(#a7green)"/><path d="M535 280 L980 280 L980 186" fill="none" stroke="#087f65" stroke-width="2.2"  marker-end="url(#a7green)"/><text x="750" y="270" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#087f65" text-anchor="middle" font-weight="700">直通，无需 Router 再推理</text><path d="M870 125 L810 85 L430 85 L430 104" fill="none" stroke="#8051c7" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a7purple)"/><text x="670" y="79" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#8051c7" text-anchor="middle" font-weight="400">状态汇报 / 超范围退回</text><rect x="28" y="321" width="1064" height="34" rx="8" fill="#e5f8ef"/><text x="560.0" y="343" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#087f65" text-anchor="middle" font-weight="700">订阅决定投递归属，不自动授予执行权限。</text></svg>