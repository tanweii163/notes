<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" role="img" aria-label="全双工交互：同步与异步 ReAct Loop"><defs><marker id="a10blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563eb"/></marker><marker id="a10green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f65"/></marker><marker id="a10purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8051c7"/></marker><marker id="a10orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#c66b12"/></marker><marker id="a10pink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b83272"/></marker><marker id="a10gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#52647b"/></marker><marker id="a10cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087c9a"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff" stroke="#d9e2ef"/><text x="28" y="35" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" fill="#162844" text-anchor="start" font-weight="700">10  全双工交互：同步与异步 ReAct Loop</text><text x="28" y="62" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#53647a" text-anchor="start" font-weight="400">同一长耗时工具，区别是调用是否持续占据当前推理循环</text><text x="28" y="100" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#52647b" text-anchor="start" font-weight="700">同步 run()</text><rect x="190" y="110" width="150" height="60" rx="12" fill="#eff3f8" stroke="#52647b" stroke-width="1.5"/><text x="265.0" y="136" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#52647b" text-anchor="middle" font-weight="700">调用 run</text><rect x="365" y="110" width="450" height="60" rx="12" fill="#fff1db" stroke="#c66b12" stroke-width="1.5"/><text x="590.0" y="136" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#c66b12" text-anchor="middle" font-weight="700">等待工具返回（阻塞）</text><rect x="840" y="110" width="220" height="60" rx="12" fill="#eff3f8" stroke="#52647b" stroke-width="1.5"/><text x="950.0" y="136" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#52647b" text-anchor="middle" font-weight="700">继续推理</text><path d="M340 140 L365 140" fill="none" stroke="#52647b" stroke-width="2.2"  marker-end="url(#a10gray)"/><path d="M815 140 L840 140" fill="none" stroke="#52647b" stroke-width="2.2"  marker-end="url(#a10gray)"/><text x="590" y="193" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#b83272" text-anchor="middle" font-weight="400">期间用户新消息需等待</text><text x="28" y="230" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#8051c7" text-anchor="start" font-weight="700">异步 start()</text><rect x="190" y="235" width="150" height="60" rx="12" fill="#f2eafe" stroke="#8051c7" stroke-width="1.5"/><text x="265.0" y="261" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#8051c7" text-anchor="middle" font-weight="700">start()</text><rect x="365" y="235" width="190" height="60" rx="12" fill="#e5f8ef" stroke="#087f65" stroke-width="1.5"/><text x="460.0" y="261" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#087f65" text-anchor="middle" font-weight="700">Started</text><rect x="580" y="235" width="235" height="60" rx="12" fill="#e9f2ff" stroke="#2563eb" stroke-width="1.5"/><text x="697.5" y="261" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700">处理新输入</text><rect x="840" y="235" width="220" height="60" rx="12" fill="#e5f8ef" stroke="#087f65" stroke-width="1.5"/><text x="950.0" y="261" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#087f65" text-anchor="middle" font-weight="700">接收完成事件</text><path d="M340 265 L365 265" fill="none" stroke="#8051c7" stroke-width="2.2"  marker-end="url(#a10purple)"/><path d="M555 265 L580 265" fill="none" stroke="#087f65" stroke-width="2.2"  marker-end="url(#a10green)"/><path d="M815 265 L840 265" fill="none" stroke="#087f65" stroke-width="2.2"  marker-end="url(#a10green)"/><rect x="365" y="320" width="450" height="52" rx="12" fill="#f2eafe" stroke="#8051c7" stroke-width="1.5"/><text x="590.0" y="346" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#8051c7" text-anchor="middle" font-weight="700">后台工具持续执行 / 可 stop()</text><path d="M440 295 L440 320" fill="none" stroke="#8051c7" stroke-width="2.2"  marker-end="url(#a10purple)"/><path d="M815 346 L950 346 L950 295" fill="none" stroke="#087f65" stroke-width="2.2"  marker-end="url(#a10green)"/><rect x="28" y="375" width="1064" height="34" rx="8" fill="#eff3f8"/><text x="560.0" y="397" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#52647b" text-anchor="middle" font-weight="700">异步回执表示启动成功，不代表业务任务成功；最终结果通过事件回投。</text></svg>