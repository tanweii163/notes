 font-size="15" fill="#243951" text-anchor="middle" font-weight="400">轻量接入层</text><text x="916.0" y="417" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">内网服务或专用资源</text><path d="M916 303 L916 345" fill="none" stroke="#8051c7" stroke-width="2.2"  marker-end="url(#a11purple)"/><rect x="28" y="430" width="1064" height="34" rx="8" fill="#eff3f8"/><text x="560.0" y="452" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#52647b" text-anchor="middle" font-weight="700">云端持续在线 ≠ 本地设备一直可用；设备断开后要等待重连或选择合法替代环境。</text></svg>