ont-size="18" fill="#2563eb" text-anchor="middle" font-weight="700">云端无状态计算</text><text x="253.0" y="150" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">Router / Worker Loop</text><text x="253.0" y="171" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">可弹性扩展或替换</text><rect x="640" y="99" width="450" height="106" rx="12" fill="#f2eafe" stroke="#8051c7" stroke-width="1.5"/><text x="865.0" y="125" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#8051c7" text-anchor="middle" font-weight="700">持久化状态</text><text x="865.0" y="150" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">Session / Ticket / Trigger / Thread</text><text x="865.0" y="171" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">恢复所需的状态与引用</text><path d="M478 145 L640 145" fill="none" stroke="#8051c7" stroke-width="2.2"  marker-end="url(#a11purple)"/><text x="559.0" y="136.0" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#8051c7" text-anchor="middle" font-weight="400">读写</text><path d="M640 182 L478 182" fill="none" stroke="#2563eb" stroke-width="2.2"  marker-end="url(#a11blue)"/><text x="559.0" y="173.0" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400">恢复</text><rect x="28" y="245" width="1062" height="58" rx="12" fill="#e0f5fa" stroke="#087c9a" stroke-width="1.5"/><text x="559.0" y="271" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#087c9a" text-anchor="middle" font-weight="700">执行环境接口：按任务选择目标环境，传递命令与结果</text>