<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 405" width="1120" height="405" role="img" aria-label="Inline &amp; Spill 与 Chain of Recall"><defs><marker id="a8blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563eb"/></marker><marker id="a8green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f65"/></marker><marker id="a8purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8051c7"/></marker><marker id="a8orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#c66b12"/></marker><marker id="a8pink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b83272"/></marker><marker id="a8gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#52647b"/></marker><marker id="a8cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087c9a"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff" stroke="#d9e2ef"/><text x="28" y="35" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" fill="#162844" text-anchor="start" font-weight="700">08  Inline &amp; Spill 与 Chain of Recall</text><text x="28" y="62" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#53647a" text-anchor="start" font-weight="400">将上下文窗口视为有限缓存，以稳定 ID 连接可按需展开的对象</text><rect x="28" y="105" width="320" height="123" rx="12" fill="#e9f2ff" stroke="#2563eb" stroke-width="1.5"/><text x="188.0" y="131" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700">模型上下文窗口</text><text x="188.0" y="156" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">当前事件摘要 + threadId</text><text x="188.0" y="177" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">关联对象摘要 + workerId</text><text x="188.0" y="198" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">近期邻居与少量必要正文</text><rect x="420" y="105" width="300" height="123" rx="12" fill="#f2eafe" stroke="#8051c7" stroke-width="1.5"/><text x="570.0" y="131" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#8051c7" text-anchor="middle" font-weight="700">外部对象存储</text><text x="570.0" y="156" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">长正文、历史消息、附件</text><text x="570.0" y="177" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">完整 Session / 工具结果</text><text x="570.0" y="198" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">按 ID 读取</text><path d="M348 155 L420 155" fill="none" stroke="#8051c7" stroke-width="2.2"  marker-end="url(#a8purple)"/><text x="384.0" y="146.0" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#8051c7" text-anchor="middle" font-weight="400">按需</text><path d="M420 190 L348 190" fill="none" stroke="#087f65" stroke-width="2.2"  marker-end="url(#a8green)"/><text x="384.0" y="181.0" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#087f65" text-anchor="middle" font-weight="400">返回</text><rect x="800" y="105" width="290" height="123" rx="12" fill="#fff1db" stroke="#c66b12" stroke-width="1.5"/><text x="945.0" y="131" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#c66b12" text-anchor="middle" font-weight="700">预算控制</text><text x="945.0" y="156" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">Inline：高概率有用</text><text x="945.0" y="177" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">Spill：低频或过长</text><text x="945.0" y="198" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">返回中保留下一跳 ID</text><path d="M720 166 L800 166" fill="none" stroke="#c66b12" stroke-width="2.2"  marker-end="url(#a8orange)"/><rect x="28" y="275" width="240" height="79" rx="12" fill="#e0f5fa" stroke="#087c9a" stroke-width="1.5"/><text x="148.0" y="301" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#087c9a" text-anchor="middle" font-weight="700">Trigger E7</text><text x="148.0" y="326" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">threadId=T1</text><rect x="298" y="275" width="240" height="79" rx="12" fill="#e5f8ef" stroke="#087f65" stroke-width="1.5"/><text x="418.0" y="301" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#087f65" text-anchor="middle" font-weight="700">Thread T1</text><text x="418.0" y="326" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">workerId=W1</text><path d="M268 315 L298 315" fill="none" stroke="#087f65" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a8green)"/><rect x="568" y="275" width="240" height="79" rx="12" fill="#e0f5fa" stroke="#087c9a" stroke-width="1.5"/><text x="688.0" y="301" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#087c9a" text-anchor="middle" font-weight="700">Worker W1</text><text x="688.0" y="326" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">related=T2</text><path d="M538 315 L568 315" fill="none" stroke="#087f65" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a8green)"/><rect x="838" y="275" width="240" height="79" rx="12" fill="#e5f8ef" stroke="#087f65" stroke-width="1.5"/><text x="958.0" y="301" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#087f65" text-anchor="middle" font-weight="700">Thread T2</text><text x="958.0" y="326" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">PR #42</text><path d="M808 315 L838 315" fill="none" stroke="#087f65" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a8green)"/><rect x="28" y="360" width="1064" height="34" rx="8" fill="#e9f2ff"/><text x="560.0" y="382" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700">不是把历史全塞回模型，也不是只能做向量搜索；先沿业务引用关系恢复相关上下文。</text></svg>