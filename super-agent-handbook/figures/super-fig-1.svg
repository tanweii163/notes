<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 290" width="1120" height="290" role="img" aria-label="跨信道任务连续性"><defs><marker id="a1blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563eb"/></marker><marker id="a1green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f65"/></marker><marker id="a1purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8051c7"/></marker><marker id="a1orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#c66b12"/></marker><marker id="a1pink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b83272"/></marker><marker id="a1gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#52647b"/></marker><marker id="a1cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087c9a"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff" stroke="#d9e2ef"/><text x="28" y="35" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" fill="#162844" text-anchor="start" font-weight="700">01  跨信道任务连续性</text><text x="28" y="62" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#53647a" text-anchor="start" font-weight="400">示例：一个需求跨 IM 与 GitHub 推进，而不是复制多个互不相干的聊天会话</text><rect x="28.0" y="105" width="187.2" height="115" rx="12" fill="#e9f2ff" stroke="#2563eb" stroke-width="1.5"/><text x="121.6" y="131" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700">IM 提出需求</text><text x="121.6" y="156" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">选择方案 A</text><rect x="247.2" y="105" width="187.2" height="115" rx="12" fill="#f2eafe" stroke="#8051c7" stroke-width="1.5"/><text x="340.79999999999995" y="131" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#8051c7" text-anchor="middle" font-weight="700">Worker 开发</text><text x="340.79999999999995" y="156" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">同一任务上下文</text><path d="M215.2 162 L247.2 162" fill="none" stroke="#8051c7" stroke-width="2.2"  marker-end="url(#a1purple)"/><rect x="466.4" y="105" width="187.2" height="115" rx="12" fill="#e5f8ef" stroke="#087f65" stroke-width="1.5"/><text x="560.0" y="131" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#087f65" text-anchor="middle" font-weight="700">GitHub 评审</text><text x="560.0" y="156" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">改为方案 B</text><path d="M434.4 162 L466.4 162" fill="none" stroke="#087f65" stroke-width="2.2"  marker-end="url(#a1green)"/><rect x="685.5999999999999" y="105" width="187.2" height="115" rx="12" fill="#f2eafe" stroke="#8051c7" stroke-width="1.5"/><text x="779.1999999999999" y="131" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#8051c7" text-anchor="middle" font-weight="700">Worker 修订</text><text x="779.1999999999999" y="156" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">延续此前工作</text><path d="M653.5999999999999 162 L685.5999999999999 162" fill="none" stroke="#8051c7" stroke-width="2.2"  marker-end="url(#a1purple)"/><rect x="904.8" y="105" width="187.2" height="115" rx="12" fill="#fff1db" stroke="#c66b12" stroke-width="1.5"/><text x="998.4" y="131" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#c66b12" text-anchor="middle" font-weight="700">IM 交付</text><text x="998.4" y="156" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">统一告知结论</text><path d="M872.8 162 L904.8 162" fill="none" stroke="#c66b12" stroke-width="2.2"  marker-end="url(#a1orange)"/><rect x="28" y="230" width="1064" height="34" rx="8" fill="#eff3f8"/><text x="560.0" y="252" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#52647b" text-anchor="middle" font-weight="700">用户感知同一个协作者；底层任务与 Thread 的关联负责连续性。</text></svg>