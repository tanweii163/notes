<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 290" width="1120" height="290" role="img" aria-label="从被动响应到主动行动"><defs><marker id="a2blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563eb"/></marker><marker id="a2green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087f65"/></marker><marker id="a2purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8051c7"/></marker><marker id="a2orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#c66b12"/></marker><marker id="a2pink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b83272"/></marker><marker id="a2gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#52647b"/></marker><marker id="a2cyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087c9a"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#ffffff" stroke="#d9e2ef"/><text x="28" y="35" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" fill="#162844" text-anchor="start" font-weight="700">02  从被动响应到主动行动</text><text x="28" y="62" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#53647a" text-anchor="start" font-weight="400">示例：群聊反馈未明确指派 Agent；只有满足策略和交付条件才介入</text><rect x="28.0" y="105" width="187.2" height="115" rx="12" fill="#e9f2ff" stroke="#2563eb" stroke-width="1.5"/><text x="121.6" y="131" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700">群聊信号</text><text x="121.6" y="156" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">有人反馈异常</text><rect x="247.2" y="105" width="187.2" height="115" rx="12" fill="#e5f8ef" stroke="#087f65" stroke-width="1.5"/><text x="340.79999999999995" y="131" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#087f65" text-anchor="middle" font-weight="700">准入判断</text><text x="340.79999999999995" y="156" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">来源 / 策略</text><path d="M215.2 162 L247.2 162" fill="none" stroke="#087f65" stroke-width="2.2"  marker-end="url(#a2green)"/><rect x="466.4" y="105" width="187.2" height="115" rx="12" fill="#f2eafe" stroke="#8051c7" stroke-width="1.5"/><text x="560.0" y="131" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#8051c7" text-anchor="middle" font-weight="700">后台复现</text><text x="560.0" y="156" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">收集证据</text><path d="M434.4 162 L466.4 162" fill="none" stroke="#8051c7" stroke-width="2.2"  marker-end="url(#a2purple)"/><rect x="685.5999999999999" y="105" width="187.2" height="115" rx="12" fill="#fff1db" stroke="#c66b12" stroke-width="1.5"/><text x="779.1999999999999" y="131" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#c66b12" text-anchor="middle" font-weight="700">验证修复</text><text x="779.1999999999999" y="156" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">测试与评估</text><path d="M653.5999999999999 162 L685.5999999999999 162" fill="none" stroke="#c66b12" stroke-width="2.2"  marker-end="url(#a2orange)"/><rect x="904.8" y="105" width="187.2" height="115" rx="12" fill="#fce8f1" stroke="#b83272" stroke-width="1.5"/><text x="998.4" y="131" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#b83272" text-anchor="middle" font-weight="700">交付或静默</text><text x="998.4" y="156" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#243951" text-anchor="middle" font-weight="400">有价值才通知</text><path d="M872.8 162 L904.8 162" fill="none" stroke="#b83272" stroke-width="2.2"  marker-end="url(#a2pink)"/><rect x="28" y="230" width="1064" height="34" rx="8" fill="#eff3f8"/><text x="560.0" y="252" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#52647b" text-anchor="middle" font-weight="700">主动不等于擅自行动：后台试探和对外产生副作用必须分别受控。</text></svg>