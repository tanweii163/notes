<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="520" viewBox="0 0 1060 520">
  <rect width="1060" height="520" fill="#fbfbfd"/>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:15px}.layer{font-size:17px;font-weight:650}.box{rx:16;stroke-width:2}.arrow{stroke:#60708a;stroke-width:2.8;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#60708a"/></marker></defs>
  <text x="40" y="45" class="title">ETCLOVG 不是清单，而是一条控制闭环</text>
  <rect x="70" y="100" width="180" height="86" class="box" fill="#eef5ff" stroke="#4b7bec"/><text x="160" y="135" text-anchor="middle" class="layer">E 执行环境</text><text x="160" y="162" text-anchor="middle" class="sub">隔离 / 重置 / 运行</text>
  <rect x="305" y="100" width="180" height="86" class="box" fill="#f0fbf4" stroke="#35a853"/><text x="395" y="135" text-anchor="middle" class="layer">T 工具接口</text><text x="395" y="162" text-anchor="middle" class="sub">能力暴露 / 调用</text>
  <rect x="540" y="100" width="180" height="86" class="box" fill="#fff7e8" stroke="#f0a33a"/><text x="630" y="135" text-anchor="middle" class="layer">C 上下文</text><text x="630" y="162" text-anchor="middle" class="sub">选择 / 压缩 / 记忆</text>
  <rect x="775" y="100" width="180" height="86" class="box" fill="#f5efff" stroke="#8a5cf6"/><text x="865" y="135" text-anchor="middle" class="layer">L 生命周期</text><text x="865" y="162" text-anchor="middle" class="sub">状态 / 恢复 / 编排</text>
  <rect x="188" y="300" width="180" height="86" class="box" fill="#eefaff" stroke="#23a6d5"/><text x="278" y="335" text-anchor="middle" class="layer">O 可观测性</text><text x="278" y="362" text-anchor="middle" class="sub">Trace / 成本 / 故障</text>
  <rect x="438" y="300" width="180" height="86" class="box" fill="#fff1f1" stroke="#f05252"/><text x="528" y="335" text-anchor="middle" class="layer">V 验证评估</text><text x="528" y="362" text-anchor="middle" class="sub">判断 / 归因 / 回归</text>
  <rect x="688" y="300" width="180" height="86" class="box" fill="#f2f2f2" stroke="#667085"/><text x="778" y="335" text-anchor="middle" class="layer">G 治理安全</text><text x="778" y="362" text-anchor="middle" class="sub">权限 / 策略 / 审计</text>
  <path d="M250 143 H295" class="arrow"/><path d="M485 143 H530" class="arrow"/><path d="M720 143 H765" class="arrow"/>
  <path d="M865 190 C865 250 810 278 778 295" class="arrow"/>
  <path d="M688 343 H628" class="arrow"/><path d="M438 343 H378" class="arrow"/>
  <path d="M278 300 C240 250 170 230 160 196" class="arrow"/>
  <text x="40" y="470" class="sub">读法：E/T/C/L 负责“让 Agent 行动”，O/V/G 负责“让行动可解释、可纠错、可约束”，闭环质量决定真实可靠性。</text>
</svg>
