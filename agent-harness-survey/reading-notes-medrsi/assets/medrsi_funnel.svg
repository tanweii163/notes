<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">候选工具漏斗：激进探索 × 保守注册</text>
  <text x="480" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">20 轮 · 5 条独立轨迹的均值 —— 发现的门槛刻意宽松，注册的门槛刻意严格</text>

  <!-- 漏斗三层 -->
  <g text-anchor="middle">
    <!-- 层1：提议 -->
    <path d="M 180 100 L 780 100 L 720 200 L 240 200 Z" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="480" y="135" font-size="17" font-weight="bold" fill="#5b21b6">118 个候选工具被提议</text>
    <text x="480" y="158" font-size="12" fill="#7c6aa6">每轮最多 6 次开发尝试 · 三条发明路线：代码生成 / 工具组合 / 模型开发</text>
    <text x="480" y="180" font-size="12" fill="#7c6aa6">（模型开发消耗 68% 的 A100 算力）</text>

    <!-- 层2：实验池 -->
    <path d="M 260 225 L 700 225 L 640 325 L 320 325 Z" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="480" y="258" font-size="17" font-weight="bold" fill="#5b21b6">41 个进入实验池 Tᴱ</text>
    <text x="480" y="281" font-size="12" fill="#6d5ba8">门槛：discovery cohort 上 ΔP &gt; 0（宽松初筛）</text>
    <text x="480" y="303" font-size="12" fill="#6d5ba8">候选冻结：代码 + 权重 + 依赖版本 + registry 快照 hash</text>

    <!-- 层3：注册 -->
    <path d="M 340 350 L 620 350 L 560 450 L 400 450 Z" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="480" y="384" font-size="17" font-weight="bold" fill="#4c1d95">16 个注册进稳定注册表 Tˢ</text>
    <text x="480" y="407" font-size="12" fill="#5d4a9c">门槛：K=3 个后续 cohort 持续增益 ΔP̄ &gt; δ</text>
    <text x="480" y="429" font-size="12" fill="#5d4a9c">且临床代价不升 ΔC̄ ≤ 0（双门槛 + 串行 rebase）</text>
  </g>

  <!-- 右侧丢弃注释 -->
  <g text-anchor="start">
    <text x="800" y="165" font-size="13" fill="#b91c1c" font-weight="bold">77 个直接被否</text>
    <text x="800" y="185" font-size="11.5" fill="#9f4a4a">连宽松的初筛都没过</text>
    <text x="800" y="290" font-size="13" fill="#b91c1c" font-weight="bold">25 个试验期被丢弃</text>
    <text x="800" y="310" font-size="11.5" fill="#9f4a4a">discovery 时的收益</text>
    <text x="800" y="327" font-size="11.5" fill="#9f4a4a">在后续 cohort 上消退</text>
    <text x="800" y="348" font-size="11.5" fill="#9f4a4a">（30 轮中拒绝 43 个，</text>
    <text x="800" y="365" font-size="11.5" fill="#9f4a4a">其中 29 个事后证实为负收益）</text>
  </g>
  <line x1="745" y1="150" x2="712" y2="150" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="745" y1="285" x2="628" y2="285" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- 底部结论 -->
  <rect x="140" y="462" width="680" height="26" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="480" y="480" text-anchor="middle" font-size="12.5" fill="#334155">稳定工具箱不是"越攒越多"，而是离散的台阶式增长 —— 只有 13.6% 的候选活到了持久层</text>
</svg>
