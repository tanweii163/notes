<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">改进预算花在哪：按错误频率 vs 按临床后果</text>
  <text x="480" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">q_i = e_i · (1 + λ·c_i)　—— 同样的反思预算，长出完全不同的工具箱</text>

  <!-- ============ 左：均匀优先级 ============ -->
  <g>
    <rect x="20" y="80" width="450" height="400" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="245" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">均匀优先级（λ = 0）</text>
    <text x="245" y="128" text-anchor="middle" font-size="11.5" fill="#9a3412">所有错误等权 → 预算流向最高频的失败</text>

    <!-- 频率条形 -->
    <g font-size="11.5">
      <text x="50" y="165" fill="#334155">边缘病例分歧（suspect）</text>
      <rect x="250" y="152" width="190" height="18" rx="4" fill="#fb923c"/>
      <text x="448" y="166" fill="#9a3412">高频 · 63% 预算</text>

      <text x="50" y="200" fill="#334155">漏诊晚期青光眼</text>
      <rect x="250" y="187" width="40" height="18" rx="4" fill="#fdba74"/>
      <text x="298" y="201" fill="#9a3412">低频</text>

      <text x="50" y="235" fill="#334155">其他散发性错误</text>
      <rect x="250" y="222" width="70" height="18" rx="4" fill="#fdba74"/>
      <text x="328" y="236" fill="#9a3412">中低频</text>
    </g>

    <text x="245" y="278" text-anchor="middle" font-size="12.5" fill="#c2410c" font-weight="bold">↓ 长出的工具 ↓</text>
    <g text-anchor="middle" font-size="12">
      <rect x="70" y="295" width="170" height="46" rx="8" fill="#ffffff" stroke="#fdba74"/>
      <text x="155" y="315" fill="#334155">第二个 CDR 阈值校准器</text>
      <text x="155" y="332" font-size="11" fill="#9a3412">打磨边缘病例决策</text>
      <rect x="250" y="295" width="170" height="46" rx="8" fill="#ffffff" stroke="#fdba74"/>
      <text x="335" y="315" fill="#334155">视盘尺寸归一化器</text>
      <text x="335" y="332" font-size="11" fill="#9a3412">继续打磨边缘病例</text>
    </g>

    <g font-size="12.5" text-anchor="middle">
      <text x="245" y="375" fill="#9a3412">训练 bAcc 97.8%（更高）</text>
      <text x="245" y="397" fill="#b91c1c" font-weight="bold">测试 bAcc 88.7% 停滞（train-test gap 9.1）</text>
      <text x="245" y="419" fill="#9a3412">临床代价 6.0 / 严重错误 4.0%</text>
      <text x="245" y="445" fill="#7c2d12" font-size="11.5">学会的是"训练集错误的分布"，</text>
      <text x="245" y="462" font-size="11.5">不是"哪些错误在真实患者身上最致命"</text>
    </g>
  </g>

  <!-- ============ 右：临床代价感知 ============ -->
  <g>
    <rect x="490" y="80" width="450" height="400" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="715" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d28d9">临床代价感知（λ = 2）</text>
    <text x="715" y="128" text-anchor="middle" font-size="11.5" fill="#5b21b6">错误 × 后果加权 → 预算流向最致命的失败</text>

    <g font-size="11.5">
      <text x="520" y="165" fill="#334155">漏诊晚期青光眼并出院</text>
      <rect x="720" y="152" width="190" height="18" rx="4" fill="#8b5cf6"/>
      <text x="712" y="166" text-anchor="end" fill="#5b21b6">c = 0.75 → q = 2.5</text>

      <text x="520" y="200" fill="#334155">早期青光眼被误 discharge</text>
      <rect x="720" y="187" width="150" height="18" rx="4" fill="#a78bfa"/>
      <text x="712" y="201" text-anchor="end" fill="#5b21b6">c 较高 → 优先</text>

      <text x="520" y="235" fill="#334155">边缘病例分歧</text>
      <rect x="720" y="222" width="45" height="18" rx="4" fill="#ddd6fe"/>
      <text x="712" y="236" text-anchor="end" fill="#5b21b6">c ≈ 0.25 → q = 1.5</text>
    </g>

    <text x="715" y="278" text-anchor="middle" font-size="12.5" fill="#6d28d9" font-weight="bold">↓ 长出的工具 ↓</text>
    <g text-anchor="middle" font-size="12">
      <rect x="540" y="295" width="170" height="46" rx="8" fill="#ffffff" stroke="#a78bfa"/>
      <text x="625" y="315" fill="#334155">ISNT 扇区 rim 宽度测量</text>
      <text x="625" y="332" font-size="11" fill="#5b21b6">R7 · 针对"漏晚期"</text>
      <rect x="720" y="295" width="170" height="46" rx="8" fill="#ffffff" stroke="#a78bfa"/>
      <text x="805" y="315" fill="#334155">PPA（视盘旁萎缩）分级</text>
      <text x="805" y="332" font-size="11" fill="#5b21b6">R9 · 针对"漏早期"</text>
    </g>

    <g font-size="12.5" text-anchor="middle">
      <text x="715" y="375" fill="#5b21b6">训练 bAcc 95.7%</text>
      <text x="715" y="397" fill="#15803d" font-weight="bold">测试 bAcc 94.1%（train-test gap 仅 1.6）</text>
      <text x="715" y="419" fill="#5b21b6">临床代价 2.5 / 严重错误 1.5%</text>
      <text x="715" y="445" fill="#4c1d95" font-size="11.5">58% 预算投向高后果失败：</text>
      <text x="715" y="462" font-size="11.5">漏诊晚期从 1.3% → 0.4%，晚期敏感性 92.6% → 97.9%</text>
    </g>
  </g>
</svg>
