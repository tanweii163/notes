<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">慢注册防的不是坏工具，是坏轨迹的递归</text>
  <text x="480" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">同一个 rim 纹理评分工具，在两种注册策略下的命运（30 轮青光眼轨迹）</text>

  <!-- ============ 左：立即注册 ============ -->
  <g>
    <rect x="20" y="80" width="450" height="420" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="245" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">立即注册（ablation）</text>

    <g text-anchor="middle" font-size="12">
      <rect x="60" y="130" width="150" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text x="135" y="152" fill="#334155" font-weight="bold">纹理工具 discovery</text>
      <text x="135" y="170" fill="#16a34a" font-weight="bold">+6.1 点 → 直接注册</text>

      <rect x="280" y="130" width="150" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text x="355" y="152" fill="#334155" font-weight="bold">后续 3 个 cohort</text>
      <text x="355" y="170" fill="#dc2626" font-weight="bold">−2.3 / −5.4 / −3.1</text>

      <rect x="60" y="225" width="150" height="66" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <text x="135" y="248" fill="#334155" font-weight="bold">输出污染执行记录</text>
      <text x="135" y="266" fill="#7f1d1d" font-size="11">planner 在 81% 的病例</text>
      <text x="135" y="282" font-size="11" fill="#7f1d1d">调用这个坏分数</text>

      <rect x="280" y="225" width="150" height="66" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <text x="355" y="248" fill="#334155" font-weight="bold">反思被带偏</text>
      <text x="355" y="266" font-size="11" fill="#7f1d1d">越来越多的失败聚类</text>
      <text x="355" y="282" font-size="11" fill="#7f1d1d">源自它自己的误导</text>

      <rect x="170" y="330" width="150" height="52" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <text x="245" y="352" fill="#334155" font-weight="bold">4 轮内衍生出 3 个</text>
      <text x="245" y="370" fill="#7f1d1d">后处理坏分数的新工具</text>
    </g>

    <!-- 反馈环箭头 -->
    <path d="M 210 156 L 280 156" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrR)"/>
    <path d="M 320 182 L 180 225" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrR)"/>
    <path d="M 210 258 L 280 258" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrR)"/>
    <path d="M 320 291 C 400 330, 360 350, 320 350" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arrR)"/>
    <!-- 大回环：新工具 → 污染记录 -->
    <path d="M 170 356 C 90 390, 80 300, 60 291 L 60 291" stroke="#dc2626" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
    <text x="112" y="415" font-size="11.5" fill="#b91c1c" font-weight="bold">破坏性反馈环 ↺</text>

    <text x="245" y="478" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="bold">bAcc：89.6%（R8 峰值）→ 76.9%（R30），57 个工具</text>
  </g>

  <!-- ============ 右：慢注册 ============ -->
  <g>
    <rect x="490" y="80" width="450" height="420" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="715" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">MedRSI 慢注册</text>

    <g text-anchor="middle" font-size="12">
      <rect x="530" y="130" width="150" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text x="605" y="152" fill="#334155" font-weight="bold">纹理工具 discovery</text>
      <text x="605" y="170" fill="#16a34a" font-weight="bold">+6.1 点 → 进实验池</text>

      <rect x="750" y="130" width="150" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text x="825" y="152" fill="#334155" font-weight="bold">K=3 cohort 试验</text>
      <text x="825" y="170" fill="#dc2626" font-weight="bold">mean −1.2 &lt; δ</text>

      <rect x="640" y="230" width="150" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <text x="715" y="255" fill="#334155" font-weight="bold">未过门槛 → 丢弃</text>
      <text x="715" y="275" font-size="11" fill="#166534">归档留证，但输出永远</text>
      <text x="715" y="291" font-size="11" fill="#166534">不进入稳定诊断轨迹</text>

      <rect x="560" y="330" width="310" height="66" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <text x="715" y="355" fill="#334155" font-weight="bold">稳定注册表保持"最后验证过的状态"</text>
      <text x="715" y="375" font-size="11.5" fill="#166534">后续反思与发明建立在干净的轨迹上</text>
    </g>

    <path d="M 680 156 L 750 156" stroke="#475569" stroke-width="1.5" marker-end="url(#arrG)"/>
    <path d="M 800 182 L 740 230" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrG)"/>

    <text x="715" y="435" text-anchor="middle" font-size="12" fill="#166534">30 轮共拒绝 43 个"discovery 达标"的工具</text>
    <text x="715" y="455" text-anchor="middle" font-size="12" fill="#166534">其中 29 个后来证实 mean trial gain 为负</text>

    <text x="715" y="478" text-anchor="middle" font-size="13" fill="#15803d" font-weight="bold">bAcc：94.4%（R30），仅 18 个工具，无单轮回撤 &gt; 0.3</text>
  </g>
</svg>
