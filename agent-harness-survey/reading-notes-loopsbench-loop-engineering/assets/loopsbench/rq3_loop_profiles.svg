<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="900" height="540" rx="12" fill="#f8fafc"/>

  <rect x="0" y="0" width="900" height="50" rx="12" fill="#1e293b"/>
  <text x="450" y="32" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">RQ3：四种 loop profile——上下文更新 vs 回归压力</text>

  <!-- Four cards -->
  <!-- Card 1: Codex goal mode -->
  <rect x="40" y="80" width="195" height="210" rx="10" fill="#f0f9ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="80" width="195" height="34" rx="10" fill="#3b82f6"/>
  <text x="137" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Codex goal mode</text>
  <text x="137" y="140" text-anchor="middle" font-size="12" fill="#1e40af">Rounds: 32.76</text>
  <rect x="60" y="155" width="155" height="20" rx="5" fill="#dbeafe"/>
  <text x="137" y="169" text-anchor="middle" font-size="11" fill="#1e40af">RR: 20.59%</text>
  <rect x="60" y="180" width="155" height="20" rx="5" fill="#fee2e2"/>
  <text x="137" y="194" text-anchor="middle" font-size="11" fill="#991b1b">Reg/run: 0.34</text>
  <text x="137" y="230" text-anchor="middle" font-size="10.5" fill="#64748b">持久目标在 Codex loop 内部</text>
  <text x="137" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">auto-compaction @ 0.9 窗口</text>
  <text x="137" y="272" text-anchor="middle" font-size="10.5" fill="#64748b">状态保留较好</text>

  <!-- Card 2: Claude Code goal -->
  <rect x="245" y="80" width="195" height="210" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="245" y="80" width="195" height="34" rx="10" fill="#22c55e"/>
  <text x="342" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Claude goal mode</text>
  <text x="342" y="140" text-anchor="middle" font-size="12" fill="#166534">Rounds: 34.69</text>
  <rect x="265" y="155" width="155" height="20" rx="5" fill="#dcfce7"/>
  <text x="342" y="169" text-anchor="middle" font-size="11" fill="#166534">RR: 17.65%</text>
  <rect x="265" y="180" width="155" height="20" rx="5" fill="#dcfce7"/>
  <text x="342" y="194" text-anchor="middle" font-size="11" fill="#166534">Reg/run: 0.13 ★最低</text>
  <text x="342" y="230" text-anchor="middle" font-size="10.5" fill="#64748b">每轮后检查 session condition</text>
  <text x="342" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">回归纪律最好</text>
  <text x="342" y="272" text-anchor="middle" font-size="10.5" fill="#64748b">但 RR 不高</text>

  <!-- Card 3: dynamic workflows -->
  <rect x="450" y="80" width="195" height="210" rx="10" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="450" y="80" width="195" height="34" rx="10" fill="#a855f7"/>
  <text x="547" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Claude dynamic workflows</text>
  <text x="547" y="140" text-anchor="middle" font-size="12" fill="#6b21a8">Rounds: 97.96 ★最多</text>
  <rect x="470" y="155" width="155" height="20" rx="5" fill="#f3e8ff"/>
  <text x="547" y="169" text-anchor="middle" font-size="11" fill="#6b21a8">RR: 24.11% ★最高</text>
  <rect x="470" y="180" width="155" height="20" rx="5" fill="#fee2e2"/>
  <text x="547" y="194" text-anchor="middle" font-size="11" fill="#991b1b">Reg/run: 0.36</text>
  <text x="547" y="230" text-anchor="middle" font-size="10.5" fill="#64748b">任务特定 worker + 窄上下文</text>
  <text x="547" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">减少对单一 transcript 依赖</text>
  <text x="547" y="272" text-anchor="middle" font-size="10.5" fill="#64748b">但 worker 返回时需显式状态追踪</text>

  <!-- Card 4: Ralph loop -->
  <rect x="655" y="80" width="205" height="210" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="655" y="80" width="205" height="34" rx="10" fill="#f97316"/>
  <text x="757" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Ralph loop</text>
  <text x="757" y="140" text-anchor="middle" font-size="12" fill="#c2410c">Rounds: 13.24 ★最少</text>
  <rect x="675" y="155" width="165" height="20" rx="5" fill="#ffedd5"/>
  <text x="757" y="169" text-anchor="middle" font-size="11" fill="#c2410c">RR: 7.84%</text>
  <rect x="675" y="180" width="165" height="20" rx="5" fill="#ffedd5"/>
  <text x="757" y="194" text-anchor="middle" font-size="11" fill="#c2410c">Reg/run: 0.17</text>
  <text x="757" y="230" text-anchor="middle" font-size="10.5" fill="#64748b">残差工作新开一次调用</text>
  <text x="757" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">（fresh invocation）</text>
  <text x="757" y="272" text-anchor="middle" font-size="10.5" fill="#64748b">上下文最省但推进最弱</text>

  <!-- Bottom insight -->
  <rect x="40" y="310" width="820" height="210" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">两个发现 + 一个根本张力</text>
  <line x1="70" y1="352" x2="830" y2="352" stroke="#e2e8f0" stroke-width="1"/>

  <text x="170" y="380" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">发现 ①：上下文更新方式因 loop 而异</text>
  <text x="170" y="404" text-anchor="middle" font-size="11.5" fill="#475569">动态工作流 97.96 rounds vs Ralph 13.24</text>
  <text x="170" y="424" text-anchor="middle" font-size="11.5" fill="#475569">换上下文 ≠ 保留状态</text>

  <text x="450" y="380" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">发现 ②：上下文预算更新不消除回归</text>
  <text x="450" y="404" text-anchor="middle" font-size="11.5" fill="#475569">四种 profile 回归事件全部可见</text>
  <text x="450" y="424" text-anchor="middle" font-size="11.5" fill="#475569">worker 返回时需显式状态追踪</text>

  <text x="730" y="380" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">根本张力</text>
  <text x="730" y="404" text-anchor="middle" font-size="11.5" fill="#475569">上下文新鲜度 ↔ 状态连续性</text>
  <text x="730" y="424" text-anchor="middle" font-size="11.5" fill="#475569">长上下文记一切（会塞满/遗忘）</text>
  <text x="730" y="444" text-anchor="middle" font-size="11.5" fill="#475569">vs 频繁换新（状态在交接处丢）</text>

  <line x1="310" y1="368" x2="310" y2="452" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="590" y1="368" x2="590" y2="452" stroke="#e2e8f0" stroke-width="1"/>

  <text x="450" y="490" text-anchor="middle" font-size="12.5" fill="#6b21a8" font-weight="700">→ 路由（routing）与状态追踪（state tracking）是当前 loop engineering 的核心局限</text>

  <text x="450" y="515" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">注：四种运行使用各自的 native 模型+loop 配置，是观测的 loop profile，不是模型受控的因果比较（附录 N.3）</text>
</svg>
