<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="900" height="560" rx="12" fill="#f8fafc"/>

  <rect x="0" y="0" width="900" height="50" rx="12" fill="#1e293b"/>
  <text x="450" y="32" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">RQ1 结果：benchmark 背景对比 + 模型扫描 + loop 扫描</text>

  <!-- Panel 1: context comparison -->
  <text x="180" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">① 评测契约变了：分数通胀的结构性回答</text>

  <!-- bar: SWE-bench Verified -->
  <rect x="90" y="95" width="760" height="34" rx="6" fill="#e2e8f0"/>
  <rect x="90" y="95" width="722" height="34" rx="6" fill="#38bdf8"/>
  <text x="400" y="117" text-anchor="middle" font-size="12" fill="#0c4a6e" font-weight="700">SWE-bench Verified ≈ 95.0%（单补丁终局）</text>

  <!-- bar: LoopsBench -->
  <rect x="90" y="140" width="760" height="34" rx="6" fill="#e2e8f0"/>
  <rect x="90" y="140" width="190" height="34" rx="6" fill="#f87171"/>
  <text x="400" y="162" text-anchor="middle" font-size="12" fill="#7f1d1d" font-weight="700">LOOPSBENCH 最强配置 = 25.00%（Opus-4.7 + Claude Code + outer continuation）</text>

  <text x="450" y="195" text-anchor="middle" font-size="11.5" fill="#64748b">不是能力倒退——是评测维度从"改一个 patch"变成"在累积义务约束下连续完成多个 patch"</text>

  <!-- Panel 2: model sweep (fixed loop: Claude Code) -->
  <text x="230" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">② 固定 loop 下的模型扫描（RR with outer loop）</text>
  <rect x="60" y="245" width="760" height="115" rx="8" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>

  <!-- bar 1 Opus-4.7 25.00 -->
  <text x="115" y="272" font-size="11" fill="#475569">Opus-4.7</text>
  <rect x="190" y="262" width="178" height="14" rx="4" fill="#dc2626"/>
  <text x="373" y="273" font-size="11" fill="#dc2626" font-weight="700">25.0%</text>

  <text x="115" y="295" font-size="11" fill="#475569">GPT-5.5</text>
  <rect x="190" y="285" width="146" height="14" rx="4" fill="#f87171"/>
  <text x="341" y="296" font-size="11" fill="#ea580c" font-weight="700">20.5%</text>

  <text x="115" y="318" font-size="11" fill="#475569">GLM-5.1</text>
  <rect x="190" y="308" width="134" height="14" rx="4" fill="#fb923c"/>
  <text x="329" y="319" font-size="11" fill="#ea580c" font-weight="700">18.8%</text>

  <text x="115" y="341" font-size="11" fill="#475569">DS-V4P</text>
  <rect x="190" y="331" width="134" height="14" rx="4" fill="#fbbf24"/>
  <text x="329" y="342" font-size="11" fill="#d97706" font-weight="700">18.8%</text>

  <text x="115" y="364" font-size="11" fill="#475569">Gemini-3.1</text>
  <rect x="190" y="354" width="102" height="14" rx="4" fill="#fde047"/>
  <text x="297" y="365" font-size="11" fill="#ca8a04" font-weight="700">14.3%</text>

  <text x="375" y="272" font-size="11" fill="#64748b">·</text>

  <!-- Panel 3: loop sweep (fixed model gpt-5.4) -->
  <text x="230" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">③ 固定模型下的 loop 扫描（RR with outer loop）</text>
  <rect x="60" y="400" width="760" height="140" rx="8" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>

  <text x="110" y="427" font-size="11" fill="#475569">Codex</text>
  <rect x="190" y="417" width="118" height="14" rx="4" fill="#a78bfa"/>
  <text x="313" y="428" font-size="11" fill="#7c3aed" font-weight="700">18.8%</text>

  <text x="110" y="450" font-size="11" fill="#475569">Claude Code</text>
  <rect x="190" y="440" width="112" height="14" rx="4" fill="#c084fc"/>
  <text x="307" y="451" font-size="11" fill="#7c3aed" font-weight="700">17.9%</text>

  <text x="110" y="473" font-size="11" fill="#475569">Copilot</text>
  <rect x="190" y="463" width="96" height="14" rx="4" fill="#e879f9"/>
  <text x="291" y="474" font-size="11" fill="#c026d3" font-weight="700">15.2%</text>

  <text x="110" y="496" font-size="11" fill="#475569">OpenHands</text>
  <rect x="190" y="486" width="62" height="14" rx="4" fill="#fda4af"/>
  <text x="257" y="497" font-size="11" fill="#e11d48" font-weight="700">9.8%</text>

  <text x="110" y="519" font-size="11" fill="#475569">SWE-agent</text>
  <rect x="190" y="509" width="56" height="14" rx="4" fill="#fda4af"/>
  <text x="251" y="520" font-size="11" fill="#e11d48" font-weight="700">8.9%</text>

  <text x="110" y="542" font-size="11" fill="#475569">mini-swe</text>
  <rect x="190" y="532" width="45" height="14" rx="4" fill="#fda4af"/>
  <text x="240" y="543" font-size="11" fill="#e11d48" font-weight="700">7.1%</text>

  <!-- scale note -->
  <text x="760" y="440" font-size="10.5" fill="#94a3b8">条宽 ∝ RR（1% ≈ 7.1px）</text>
  <text x="760" y="458" font-size="10.5" fill="#94a3b8">闭源 loop（Codex/Claude/Copilot）明显领先开源 loop（OpenHands/SWE-agent 系）</text>
</svg>
