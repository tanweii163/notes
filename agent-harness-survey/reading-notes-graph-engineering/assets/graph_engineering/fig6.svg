<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1080 405" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="f6a" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="30" y="255" width="300" height="85" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="180" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#475569">隐式组织</text>
  <text x="180" y="316" text-anchor="middle" font-size="13" fill="#64748b">一切挤在上下文与日志里</text>

  <rect x="360" y="175" width="330" height="165" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="525" y="207" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">graph-structured · 有图结构</text>
  <text x="525" y="237" text-anchor="middle" font-size="13" fill="#475569">工作 / 团队 / 状态已显式化</text>
  <text x="525" y="261" text-anchor="middle" font-size="13" fill="#475569">但结构执行前固定或手工选择</text>
  <text x="525" y="287" text-anchor="middle" font-size="11.5" fill="#64748b">（LangGraph 工作流、固定 team 拓扑）</text>
  <text x="525" y="152" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b45309">📍 大多数当代系统在这里</text>
  <line x1="525" y1="159" x2="525" y2="171" stroke="#b45309" stroke-width="2" marker-end="url(#f6a)"/>

  <rect x="720" y="95" width="330" height="245" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="885" y="127" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">graph-engineered · 图工程</text>
  <text x="885" y="157" text-anchor="middle" font-size="13" fill="#475569">结构本身是被操作的对象：</text>
  <text x="885" y="181" text-anchor="middle" font-size="13" fill="#475569">调度 · 验证 · 归因 · 进化 · 回滚</text>
  <text x="885" y="205" text-anchor="middle" font-size="13" fill="#475569">运行时证据 → 持久结构改进</text>
  <text x="885" y="229" text-anchor="middle" font-size="13" fill="#475569">变更可追溯、可版本化、可回滚</text>
  <text x="885" y="253" text-anchor="middle" font-size="13" fill="#475569">并能跨任务、跨时间迁移复用</text>

  <line x1="60" y1="375" x2="1020" y2="375" stroke="#94a3b8" stroke-width="2" marker-end="url(#f6a)"/>
  <text x="540" y="398" text-anchor="middle" font-size="12.5" fill="#94a3b8">结构自主性递增 —— graph-structured ≠ graph-engineered</text>
</svg>