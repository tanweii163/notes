  <rect x="390" y="98" width="96" height="36" rx="18" fill="#ffffff" stroke="#f87171" stroke-width="1.8"/><text x="438" y="121" text-anchor="middle" font-size="12" fill="#7f1d1d">检测异常</text>
  <rect x="496" y="98" width="96" height="36" rx="18" fill="#ffffff" stroke="#f87171" stroke-width="1.8"/><text x="544" y="121" text-anchor="middle" font-size="12" fill="#7f1d1d">回溯依赖</text>
  <rect x="602" y="98" width="96" height="36" rx="18" fill="#ffffff" stroke="#f87171" stroke-width="1.8"/><text x="650" y="121" text-anchor="middle" font-size="12" fill="#7f1d1d">假设检验</text>
