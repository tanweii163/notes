  <rect x="141" y="98" width="88" height="36" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="1.8"/><text x="185" y="121" text-anchor="middle" font-size="12.5" fill="#1e3a8a">验证</text>
  <rect x="246" y="98" width="88" height="36" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="1.8"/><text x="290" y="121" text-anchor="middle" font-size="12.5" fill="#1e3a8a">提交</text>
  <line x1="125" y1="116" x2="138" y2="116" stroke="#475569" stroke-width="1.6" marker-end="url(#f5a)"/>
