  <text x="751" y="216" font-size="11" fill="#94a3b8">内部状态可回滚；外部效应需补偿（SagaLLM / Atomix）</text>

  <path d="M 900 235 C 820 325, 260 325, 180 235" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#f5g)"/>
  <text x="540" y="348" text-anchor="middle" font-size="13" fill="#475569">恢复结果与证据写回状态记录 —— record → diagnose → recover 闭环</text>
