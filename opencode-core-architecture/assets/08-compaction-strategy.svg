<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555B66"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#3A3A40">一个 Provider Turn 内的两道压缩防线</text>

  <!-- ═══ 主流程 ═══ -->

  <text x="370" y="50" text-anchor="middle" font-size="11" fill="#8A8A93">turn 开始</text>

  <!-- ① 构建 request（中性灰） -->
  <g>
    <rect x="250" y="58" width="240" height="50" rx="8" fill="#F2F2F4" stroke="#8A8A93" stroke-width="1.5"/>
    <text x="370" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#3A3A40">① 构建 request</text>
    <text x="370" y="97" text-anchor="middle" font-size="11" fill="#3A3A40" opacity="0.8">system + messages + tools</text>
  </g>

  <line x1="370" y1="108" x2="370" y2="132" stroke="#555B66" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ② 自动压缩（写入侧蓝） -->
  <g>
    <rect x="220" y="136" width="300" height="54" rx="8" fill="#EAF2FB" stroke="#2F6FB0" stroke-width="1.5"/>
    <text x="370" y="159" text-anchor="middle" font-size="13" font-weight="700" fill="#1B3B5F">② 自动压缩 compactIfNeeded</text>
    <text x="370" y="177" text-anchor="middle" font-size="11" fill="#1B3B5F" opacity="0.8">发请求前 · 主动预防</text>
  </g>

  <!-- ② 旁注 -->
  <text x="534" y="156" font-size="10" fill="#8A8A93">受 config.compaction.auto 开关控制</text>
  <text x="534" y="172" font-size="10" fill="#8A8A93">入口 llm.ts:215</text>
  <line x1="520" y1="160" x2="530" y2="160" stroke="#8A8A93" stroke-width="1" stroke-dasharray="3 2"/>

  <line x1="370" y1="190" x2="370" y2="220" stroke="#555B66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="402" y="210" font-size="11" fill="#555B66" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">估算 token</text>

  <!-- 判定菱形（强调色描边） -->
  <polygon points="370,224 452,260 370,296 288,260" fill="#FBEDED" stroke="#C0392B" stroke-width="1.5"/>
  <text x="370" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#6E1F18">超阈值？</text>

  <!-- 左分支「超」→ 压缩 → 回环重跑 -->
  <line x1="288" y1="260" x2="140" y2="260" stroke="#555B66" stroke-width="1.6"/>
  <text x="255" y="252" font-size="11" fill="#555B66" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">超</text>

  <path d="M 140 260 Q 98 260 98 228 L 98 112 Q 98 84 130 84 L 248 84"
        fill="none" stroke="#555B66" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="36" y="178" font-size="10" fill="#555B66">压缩 →</text>
  <text x="14" y="194" font-size="9" fill="#555B66">抛 ContinueAfter-</text>
  <text x="14" y="207" font-size="9" fill="#555B66">Compaction</text>
  <text x="14" y="223" font-size="10" font-weight="700" fill="#555B66">重跑本 turn</text>

  <!-- 下分支「没超」 -->
  <line x1="370" y1="296" x2="370" y2="322" stroke="#555B66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="393" y="314" font-size="11" fill="#555B66" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">没超</text>

  <!-- ③ llm.stream（中性灰） -->
  <g>
    <rect x="250" y="326" width="240" height="48" rx="8" fill="#F2F2F4" stroke="#8A8A93" stroke-width="1.5"/>
    <text x="370" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#3A3A40">③ llm.stream(request)</text>
    <text x="370" y="364" text-anchor="middle" font-size="11" fill="#3A3A40" opacity="0.8">→ provider</text>
  </g>

  <!-- 分叉：正常返回 -->
  <path d="M 370 374 L 200 374 L 200 400" fill="none" stroke="#555B66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="278" y="368" font-size="11" fill="#555B66" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">正常返回</text>

  <g>
    <rect x="140" y="404" width="120" height="34" rx="8" fill="#EAF6EE" stroke="#2E9E5B" stroke-width="1.5"/>
    <text x="200" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#1B4A2C">turn 继续</text>
  </g>

  <!-- 分叉：context overflow 报错（红色强调） -->
  <path d="M 370 374 L 565 374 L 565 410" fill="none" stroke="#C0392B" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <text x="468" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#C0392B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">context overflow 报错</text>

  <!-- ④ 溢出压缩（写入侧蓝） -->
  <g>
    <rect x="415" y="414" width="300" height="54" rx="8" fill="#EAF2FB" stroke="#2F6FB0" stroke-width="1.5"/>
    <text x="565" y="437" text-anchor="middle" font-size="12" font-weight="700" fill="#1B3B5F">④ 溢出压缩 compactAfterOverflow</text>
    <text x="565" y="455" text-anchor="middle" font-size="11" fill="#1B3B5F" opacity="0.8">收到错误后 · 被动兜底</text>
  </g>

  <!-- ④ 旁注 -->
  <text x="565" y="484" text-anchor="middle" font-size="10" fill="#8A8A93">不受开关控制 · 仅 overflow 时触发 · 入口 llm.ts:286</text>

  <!-- ④ 回环：重跑（仅一次） -->
  <path d="M 715 441 Q 762 441 762 410 L 762 112 Q 762 84 732 84 L 492 84"
        fill="none" stroke="#555B66" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="640" y="72" text-anchor="middle" font-size="9" fill="#555B66">抛 ContinueAfterOverflowCompaction</text>
  <text x="780" y="270" font-size="10" font-weight="700" fill="#555B66">重跑</text>
  <text x="780" y="285" font-size="10" font-weight="700" fill="#C0392B">（仅一次）</text>

  <!-- ═══ 共享实现说明（账本区金色强调） ═══ -->
  <rect x="40" y="518" width="920" height="68" rx="10" fill="#FCF3E3" stroke="#C8881F" stroke-width="1.5"/>
  <text x="500" y="541" text-anchor="middle" font-size="13" font-weight="700" fill="#6B4A0E">关键：两套策略最终都调用同一个内部实现 compactAfterOverflow（compaction.ts:172-224）</text>
  <text x="500" y="560" text-anchor="middle" font-size="12" fill="#6B4A0E">它才是真正「切历史、跑摘要、写账本」的核心 —— 区别只在触发条件</text>
  <text x="500" y="577" text-anchor="middle" font-size="11" fill="#6B4A0E" opacity="0.8">名字有点误导（听起来只服务溢出场景），实际它是共享压缩实现</text>

  <!-- ═══ head / recent 切分示意 ═══ -->
  <rect x="40" y="608" width="920" height="192" rx="10" fill="#F5F9FD" stroke="#2F6FB0" stroke-width="1" opacity="1"/>
  <text x="500" y="633" text-anchor="middle" font-size="13" font-weight="700" fill="#1B3B5F">head / recent 切分 —— 压缩的核心操作</text>

  <!-- head 段消息块 -->
  <rect x="100" y="660" width="56" height="28" rx="4" fill="#EAF2FB" stroke="#2F6FB0" stroke-width="1.2"/>
  <text x="128" y="678" text-anchor="middle" font-size="10" fill="#1B3B5F">消息1</text>
  <rect x="162" y="660" width="56" height="28" rx="4" fill="#EAF2FB" stroke="#2F6FB0" stroke-width="1.2"/>
  <text x="190" y="678" text-anchor="middle" font-size="10" fill="#1B3B5F">消息2</text>
  <text x="240" y="679" text-anchor="middle" font-size="12" fill="#1B3B5F">…</text>
  <rect x="264" y="660" width="60" height="28" rx="4" fill="#EAF2FB" stroke="#2F6FB0" stroke-width="1.2"/>
  <text x="294" y="678" text-anchor="middle" font-size="10" fill="#1B3B5F">消息96</text>
  <rect x="330" y="660" width="60" height="28" rx="4" fill="#EAF2FB" stroke="#2F6FB0" stroke-width="1.2"/>
  <text x="360" y="678" text-anchor="middle" font-size="10" fill="#1B3B5F">消息97</text>

  <!-- 切分线 -->
  <line x1="408" y1="650" x2="408" y2="698" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="408" y="646" text-anchor="middle" font-size="10" font-weight="700" fill="#C0392B">切分线</text>

  <!-- recent 段消息块 -->
  <rect x="428" y="660" width="60" height="28" rx="4" fill="#EAF6EE" stroke="#2E9E5B" stroke-width="1.2"/>
  <text x="458" y="678" text-anchor="middle" font-size="10" fill="#1B4A2C">消息98</text>
  <rect x="494" y="660" width="60" height="28" rx="4" fill="#EAF6EE" stroke="#2E9E5B" stroke-width="1.2"/>
  <text x="524" y="678" text-anchor="middle" font-size="10" fill="#1B4A2C">消息99</text>
  <rect x="560" y="660" width="66" height="28" rx="4" fill="#EAF6EE" stroke="#2E9E5B" stroke-width="1.2"/>
  <text x="593" y="678" text-anchor="middle" font-size="10" fill="#1B4A2C">消息100</text>

  <!-- 段标注 -->
  <line x1="100" y1="696" x2="390" y2="696" stroke="#2F6FB0" stroke-width="1.2"/>
  <text x="245" y="714" text-anchor="middle" font-size="12" font-weight="700" fill="#1B3B5F">head（压成摘要）</text>
  <line x1="428" y1="696" x2="626" y2="696" stroke="#2E9E5B" stroke-width="1.2"/>
  <text x="527" y="714" text-anchor="middle" font-size="12" font-weight="700" fill="#1B4A2C">recent（Tail 原文）</text>

  <!-- 累加方向说明 -->
  <text x="500" y="745" text-anchor="middle" font-size="11" fill="#555B66">从末尾往前累加 token，加满 keepTokens（默认 8000）预算 → 预算内 = recent，超出 = head</text>
  <line x1="620" y1="762" x2="440" y2="762" stroke="#555B66" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="530" y="778" text-anchor="middle" font-size="10" fill="#8A8A93">◄ 累加方向（从末尾往前）</text>
</svg>
