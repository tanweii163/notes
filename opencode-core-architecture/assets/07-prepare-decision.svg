<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555B66"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8A93"/>
    </marker>
  </defs>

  <!-- ═══ 标题 ═══ -->
  <text x="34" y="34" font-size="16" font-weight="700" fill="#1B3B5F">prepareOnce 决策树 · 这一轮要不要更新上下文、怎么更新</text>
  <text x="34" y="52" font-size="11" fill="#3A3A40" opacity="0.7">context-epoch.ts:40-78 · initialize / reconcile / replace 三种运算的总裁判</text>

  <!-- ═══ 图例 ═══ -->
  <g>
    <rect x="560" y="24" width="12" height="12" rx="2" fill="#F2F2F4" stroke="#8A8A93" stroke-width="1"/>
    <text x="576" y="34" font-size="10" fill="#555B66">起点</text>
    <rect x="624" y="24" width="12" height="12" rx="2" fill="#FBEDED" stroke="#C0392B" stroke-width="1"/>
    <text x="640" y="34" font-size="10" fill="#555B66">判定</text>
    <rect x="688" y="24" width="12" height="12" rx="2" fill="#EAF2FB" stroke="#2F6FB0" stroke-width="1"/>
    <text x="704" y="34" font-size="10" fill="#555B66">运算</text>
    <rect x="752" y="24" width="12" height="12" rx="2" fill="#EAF6EE" stroke="#2E9E5B" stroke-width="1"/>
    <text x="768" y="34" font-size="10" fill="#555B66">出口</text>
    <rect x="816" y="24" width="12" height="12" rx="2" fill="#FCF3E3" stroke="#C8881F" stroke-width="1"/>
    <text x="832" y="34" font-size="10" fill="#555B66">关键点</text>
  </g>

  <!-- ═══ 起点：并发加载三样东西（中性灰）═══ -->
  <g>
    <rect x="360" y="70" width="280" height="80" rx="8" fill="#F2F2F4" stroke="#8A8A93" stroke-width="1.5"/>
    <text x="500" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#3A3A40">起点 · 并发加载三样东西</text>
    <text x="500" y="116" text-anchor="middle" font-size="11" fill="#3A3A40" opacity="0.9">① 当前上下文值 context</text>
    <text x="500" y="136" text-anchor="middle" font-size="11" fill="#3A3A40" opacity="0.9">② 已存 epoch 行 stored · ③ 最新压缩 compaction</text>
  </g>
  <line x1="500" y1="150" x2="500" y2="178" stroke="#555B66" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ═══ 判定①：stored 不存在？（强调红菱形）═══ -->
  <polygon points="500,180 608,222 500,264 392,222" fill="#FBEDED" stroke="#C0392B" stroke-width="1.6"/>
  <text x="500" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#6E1F18">① stored 不存在？</text>

  <!-- 是 · 无历史 → initialize（左分支） -->
  <line x1="392" y1="222" x2="282" y2="222" stroke="#555B66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="337" y="212" text-anchor="middle" font-size="11" fill="#555B66" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">是 · 无历史</text>

  <!-- initialize 运算（写入侧蓝） -->
  <g>
    <rect x="70" y="190" width="210" height="64" rx="8" fill="#EAF2FB" stroke="#2F6FB0" stroke-width="1.5"/>
    <text x="175" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#1B3B5F">initialize</text>
    <text x="175" y="238" text-anchor="middle" font-size="11" fill="#1B3B5F" opacity="0.85">无历史 · 造第一代 + insert</text>
  </g>
  <line x1="175" y1="254" x2="175" y2="284" stroke="#555B66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="184" y="274" text-anchor="start" font-size="10.5" fill="#555B66" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">insert 后返回</text>

  <!-- initialize 终点（读取侧绿） -->
  <g>
    <rect x="58" y="286" width="234" height="58" rx="8" fill="#EAF6EE" stroke="#2E9E5B" stroke-width="2"/>
    <text x="175" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#1B4A2C">返回 { baseline, baselineSeq }</text>
    <text x="175" y="330" text-anchor="middle" font-size="11" fill="#1B4A2C" opacity="0.85">◎ 终点 · 第一代建好，交给 runner</text>
  </g>

  <!-- 否 → 解码 snapshot（中轴） -->
  <line x1="500" y1="264" x2="500" y2="286" stroke="#555B66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="512" y="280" text-anchor="start" font-size="11" fill="#555B66" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">否</text>

  <!-- ② 解码 stored.snapshot（中性灰） -->
  <g>
    <rect x="410" y="288" width="180" height="40" rx="8" fill="#F2F2F4" stroke="#8A8A93" stroke-width="1.5"/>
    <text x="500" y="313" text-anchor="middle" font-size="12" fill="#3A3A40">② 解码 stored.snapshot</text>
  </g>
  <line x1="500" y1="328" x2="500" y2="352" stroke="#555B66" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ═══ 判定③：算 replacementSeq（强调红菱形）═══ -->
  <polygon points="500,354 650,412 500,470 350,412" fill="#FBEDED" stroke="#C0392B" stroke-width="1.6"/>
  <text x="500" y="398" text-anchor="middle" font-size="12" font-weight="700" fill="#6E1F18">③ 算 replacementSeq</text>
  <text x="500" y="418" text-anchor="middle" font-size="11" fill="#6E1F18" opacity="0.92">compaction 存在 且</text>
  <text x="500" y="438" text-anchor="middle" font-size="11" fill="#6E1F18" opacity="0.92">compaction.seq &gt; baseline_seq？</text>

  <!-- ④ 选运算 说明 -->
  <text x="500" y="494" text-anchor="middle" font-size="11" fill="#555B66" opacity="0.85">④ 选运算：replacementSeq 有 → replace，否则 → reconcile</text>

  <!-- 是 · 发生过压缩 → replace（左） -->
  <line x1="350" y1="412" x2="240" y2="510" stroke="#555B66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="248" y="466" text-anchor="middle" font-size="11" fill="#555B66" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">是 · 发生过压缩</text>

  <!-- 否 · 正常对账 → reconcile（右） -->
  <line x1="650" y1="412" x2="760" y2="510" stroke="#555B66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="752" y="466" text-anchor="middle" font-size="11" fill="#555B66" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">否 · 正常对账</text>

  <!-- replace 运算（写入侧蓝） -->
  <g>
    <rect x="118" y="512" width="234" height="80" rx="8" fill="#EAF2FB" stroke="#2F6FB0" stroke-width="1.5"/>
    <text x="235" y="538" text-anchor="middle" font-size="15" font-weight="700" fill="#1B3B5F">replace</text>
    <text x="235" y="558" text-anchor="middle" font-size="12" fill="#1B3B5F" opacity="0.9">有历史 · 推倒重来造全新一代</text>
    <text x="235" y="578" text-anchor="middle" font-size="10.5" fill="#1B3B5F" opacity="0.75">replacementSeq = compaction.seq</text>
  </g>

  <!-- reconcile 运算（写入侧蓝） -->
  <g>
    <rect x="648" y="512" width="234" height="80" rx="8" fill="#EAF2FB" stroke="#2F6FB0" stroke-width="1.5"/>
    <text x="765" y="538" text-anchor="middle" font-size="15" font-weight="700" fill="#1B3B5F">reconcile</text>
    <text x="765" y="558" text-anchor="middle" font-size="12" fill="#1B3B5F" opacity="0.9">有历史 · 对账（能小改就小改）</text>
    <text x="765" y="578" text-anchor="middle" font-size="10.5" fill="#1B3B5F" opacity="0.75">replacementSeq = undefined</text>
  </g>

  <!-- 两运算 → 判定⑤ -->
  <line x1="235" y1="592" x2="380" y2="648" stroke="#555B66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="765" y1="592" x2="620" y2="648" stroke="#555B66" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ═══ 判定⑤：看运算结果（强调红菱形）═══ -->
  <polygon points="500,606 618,650 500,694 382,650" fill="#FBEDED" stroke="#C0392B" stroke-width="1.6"/>
  <text x="500" y="646" text-anchor="middle" font-size="13" font-weight="700" fill="#6E1F18">⑤ 看运算结果</text>
  <text x="500" y="666" text-anchor="middle" font-size="11" fill="#6E1F18" opacity="0.92">按 result._tag 分支</text>

  <!-- 三个出口分支 -->
  <line x1="382" y1="650" x2="200" y2="722" stroke="#555B66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="270" y="686" text-anchor="middle" font-size="10.5" fill="#555B66" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">_tag = ReplacementReady</text>

  <line x1="500" y1="694" x2="500" y2="722" stroke="#555B66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="488" y="715" text-anchor="end" font-size="10.5" fill="#555B66" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">_tag = Unchanged / Blocked</text>

  <line x1="618" y1="650" x2="800" y2="722" stroke="#555B66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="730" y="686" text-anchor="middle" font-size="10.5" fill="#555B66" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">_tag = Updated</text>

  <!-- 出口 A：ReplacementReady（读取侧绿） -->
  <g>
    <rect x="58" y="724" width="278" height="108" rx="8" fill="#EAF6EE" stroke="#2E9E5B" stroke-width="2"/>
    <text x="197" y="748" text-anchor="middle" font-size="13" font-weight="700" fill="#1B4A2C">ReplacementReady</text>
    <text x="197" y="772" text-anchor="middle" font-size="11" fill="#1B4A2C" opacity="0.9">baselineSeq = replacementSeq ?? 最新账本序号</text>
    <text x="197" y="792" text-anchor="middle" font-size="11" fill="#1B4A2C" opacity="0.9">replace 进表（更新 baseline+snapshot+seq）</text>
    <text x="197" y="816" text-anchor="middle" font-size="11" font-weight="700" fill="#1B4A2C">→ 返回新的 { baseline, baselineSeq }</text>
  </g>

  <!-- 出口 B：Unchanged / ReplacementBlocked（读取侧绿） -->
  <g>
    <rect x="361" y="724" width="278" height="108" rx="8" fill="#EAF6EE" stroke="#2E9E5B" stroke-width="2"/>
    <text x="500" y="748" text-anchor="middle" font-size="13" font-weight="700" fill="#1B4A2C">Unchanged / ReplacementBlocked</text>
    <text x="500" y="780" text-anchor="middle" font-size="11" fill="#1B4A2C" opacity="0.9">啥也不改（不动表）</text>
    <text x="500" y="808" text-anchor="middle" font-size="11" font-weight="700" fill="#1B4A2C">→ 返回 stored 的 { baseline, baseline_seq }</text>
  </g>

  <!-- 出口 C：Updated（读取侧绿） -->
  <g>
    <rect x="664" y="724" width="278" height="108" rx="8" fill="#EAF6EE" stroke="#2E9E5B" stroke-width="2"/>
    <text x="803" y="748" text-anchor="middle" font-size="13" font-weight="700" fill="#1B4A2C">Updated</text>
    <text x="803" y="770" text-anchor="middle" font-size="11" fill="#1B4A2C" opacity="0.9">发 ContextUpdated 事件（带增量文本）</text>
    <text x="803" y="790" text-anchor="middle" font-size="11" fill="#1B4A2C" opacity="0.9">commit 钩子 advance：只更新 snapshot</text>
    <text x="803" y="806" text-anchor="middle" font-size="11" fill="#1B4A2C" opacity="0.9">（不动 baseline 文本和 seq）</text>
    <text x="803" y="824" text-anchor="middle" font-size="11" font-weight="700" fill="#1B4A2C">→ 返回 stored 的 { baseline, baseline_seq }</text>
  </g>

  <!-- ═══ 关键点① 为什么压缩触发 replace（账本区金，醒目）═══ -->
  <g>
    <rect x="58" y="866" width="420" height="110" rx="10" fill="#FCF3E3" stroke="#C8881F" stroke-width="2"/>
    <text x="76" y="892" font-size="13" font-weight="700" fill="#6B4A0E">关键点① 为什么压缩触发 replace？</text>
    <text x="76" y="916" font-size="11" fill="#6B4A0E" opacity="0.92">压缩把旧历史摘要化，旧的增量对账基线已失效；</text>
    <text x="76" y="936" font-size="11" fill="#6B4A0E" opacity="0.92">索性整体替换，把 baseline_seq 推到压缩点之后。</text>
    <text x="76" y="958" font-size="10.5" fill="#6B4A0E" opacity="0.7">context-epoch.ts:59</text>
  </g>

  <!-- ═══ 关键点② Updated 为什么 baseline 文本不变（账本区金，醒目）═══ -->
  <g>
    <rect x="522" y="866" width="420" height="110" rx="10" fill="#FCF3E3" stroke="#C8881F" stroke-width="2"/>
    <text x="540" y="892" font-size="13" font-weight="700" fill="#6B4A0E">关键点② Updated 为什么 baseline 文本不变？</text>
    <text x="540" y="916" font-size="11" fill="#6B4A0E" opacity="0.92">增量变化经一条 ContextUpdated 事件发给模型；</text>
    <text x="540" y="936" font-size="11" fill="#6B4A0E" opacity="0.92">baseline 保持首次完整文本，只有 snapshot 前进。</text>
    <text x="540" y="958" font-size="10.5" fill="#6B4A0E" opacity="0.7">事件落库与 advance 同一事务原子 · context-epoch.ts:72-77</text>
  </g>

  <!-- 关键点① ↔ replace（金色虚线，走左边距） -->
  <path d="M 58 900 L 40 900 L 40 552 L 116 552" fill="none" stroke="#C8881F" stroke-width="1.4" stroke-dasharray="5 4"/>
  <circle cx="118" cy="552" r="3.5" fill="#C8881F"/>
  <!-- 关键点② ↔ Updated（金色虚线，走右边距） -->
  <path d="M 942 900 L 960 900 L 960 778 L 944 778" fill="none" stroke="#C8881F" stroke-width="1.4" stroke-dasharray="5 4"/>
  <circle cx="942" cy="778" r="3.5" fill="#C8881F"/>
</svg>
